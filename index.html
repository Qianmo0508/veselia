<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0810">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>入魇 · Nightfalling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" onerror="window.__gsapFailed=true"></script>
</head>
<body>
<div id="app">
  <section class="screen active" id="screen-title">
    <div class="title-card frame">
      <span class="corner tl">❖</span><span class="corner tr">❖</span>
      <span class="corner bl">❖</span><span class="corner br">❖</span>
      <div class="title-eyebrow">☽ VESELIA · NIGHTFALLING ☾</div>
      <h1 class="title-main">入魇</h1>
      <div class="title-sub">In Nightmare We Trust</div>
      <div class="divider"><span>✦</span></div>
      <p style="font-size:12px;color:var(--text-d);letter-spacing:.14em;line-height:1.9;">梦神使叛变，魇灾吞城。<br>能在梦与醒之间活着回来的人，<br>才有资格谈论真相。</p>
      <div class="title-actions">
        <button class="btn primary" data-act="new">新 的 旅 程</button>
        <button class="btn" data-act="continue">继 续 游 戏</button>
        <button class="btn" data-act="archive">档 案 馆</button>
        <button class="btn" data-act="workshop">剧 情 工 坊</button>
        <button class="btn" data-act="settings">系 统 设 置</button>
        <button class="btn" data-act="about">关 于 本 作</button>
      </div>
      <div class="title-foot">能看见日落的人，是幸福的</div>
    </div>
  </section>

  <section class="screen" id="screen-game">
    <div class="topbar">
      <div class="tb-left"><div class="tb-mark"></div><div class="tb-title">入魇</div></div>
      <div class="tb-loc" id="topLoc">——</div>
    </div>
    <main class="stage" id="stage">
      <div class="scene-bg bg-city" id="sceneBg"></div>
      <div class="loc-bar"><span id="locLabel">未知之地</span></div>
      <div class="dialog-scroll" id="dialogScroll"><div class="dialog-inner" id="dialogInner"></div></div>
      <div class="choices" id="choices"><div class="choices-inner" id="choicesInner"></div></div>
      <div class="cont-hint" id="contHint" style="display:none;">▼</div>
    </main>
  </section>

  <section class="screen" id="screen-map">
    <div class="topbar"><div class="tb-left"><div class="tb-mark"></div><div class="tb-title">地图</div></div><div class="tb-loc" id="mapSilver">银镑 0</div></div>
    <main class="map-main" id="mapMain"></main>
  </section>

  <section class="screen" id="screen-log">
    <div class="topbar"><div class="tb-left"><div class="tb-mark"></div><div class="tb-title">记录</div></div><div class="tb-loc" id="logSub">——</div></div>
    <main class="log-main" id="logBody" style="padding:16px;overflow-y:auto;"></main>
  </section>

  <section class="screen" id="screen-settings">
    <div class="topbar"><div class="tb-left"><div class="tb-mark"></div><div class="tb-title">设置</div></div><div class="tb-loc" id="setUid">——</div></div>
    <main class="set-main" id="setMain" style="padding:16px;overflow-y:auto;"></main>
  </section>

  <nav class="bottom-nav" id="bottomNav" style="display:none;">
    <button class="nav-btn active" data-nav="game"><span class="nav-ico">◇</span><span class="nav-lbl">主页</span></button>
    <button class="nav-btn" data-nav="map"><span class="nav-ico">◈</span><span class="nav-lbl">地图</span></button>
    <button class="nav-btn" data-nav="log"><span class="nav-ico">❖</span><span class="nav-lbl">记录</span></button>
    <button class="nav-btn" data-nav="settings"><span class="nav-ico">⚙</span><span class="nav-lbl">设置</span></button>
  </nav>
</div>

<div class="modal-layer" id="modalLayer"></div>
<div class="toast-layer" id="toastLayer"></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/characters.js"></script>
<script src="js/games.js"></script>
<script src="js/workshop.js"></script>
<script src="js/main.js"></script>
</body>
</html>
