<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0810">
<title>入魇 · Nightfalling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" onerror="window.__gsapFailed=true"></script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --f-deco:"Cinzel Decorative","Noto Serif SC",serif;
  --f-en:"Cormorant Garamond",Georgia,serif;
  --f-cn:"Noto Serif SC","Songti SC","STSong",serif;
  --f-sym:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols",serif;
  --gold:#c9a961;--gold-b:#e8d5a0;--gold-d:#7a6636;
  --bg:#0a0810;--panel:#16121f;--panel2:#1c1428;
  --text:#ded5c4;--text-d:#8a8070;
  --accent:#8b2f4f;
  --line:rgba(201,169,97,.22);--line-s:rgba(201,169,97,.45);
  --font-scale:1;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --nav-h:62px;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="day"]{
  --gold:#8b6f2f;--gold-b:#4a3818;--gold-d:#8c7038;
  --bg:#f0e6d0;--panel:#fffcf2;--panel2:#fbf3e2;
  --text:#1e1810;--text-d:#5a4a30;
  --line:rgba(139,111,47,.3);--line-s:rgba(139,111,47,.6);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-cn);-webkit-font-smoothing:antialiased;font-size:calc(15px * var(--font-scale));}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 12% 6%,rgba(90,50,120,.22),transparent 55%),
             radial-gradient(ellipse at 88% 94%,rgba(139,47,79,.18),transparent 55%),
             radial-gradient(ellipse at 50% 50%,rgba(20,14,32,.5),transparent 80%);}
[data-theme="day"] body::before{background:
  radial-gradient(ellipse at 12% 6%,rgba(190,160,90,.22),transparent 55%),
  radial-gradient(ellipse at 88% 94%,rgba(180,140,90,.18),transparent 55%),
  radial-gradient(ellipse at 50% 50%,rgba(255,250,235,.6),transparent 80%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.008) 2px,rgba(255,255,255,.008) 3px);}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1;opacity:0;}
.screen.active{display:flex;opacity:1;}

.frame{position:relative;border:1px solid var(--line);background:linear-gradient(165deg,var(--panel2),var(--panel));}
.frame::before,.frame::after{content:'❖';position:absolute;font-family:var(--f-sym);font-size:12px;color:var(--gold);opacity:.85;line-height:1;pointer-events:none;transition:all .4s var(--ease);}
.frame::before{top:-7px;left:-7px;}
.frame::after{bottom:-7px;right:-7px;}
.frame:hover::before{transform:rotate(90deg) scale(1.15);opacity:1;}
.frame:hover::after{transform:rotate(-90deg) scale(1.15);opacity:1;}

.inner-frame{position:relative;}
.inner-frame::before{content:'';position:absolute;inset:3px;border:1px solid var(--line);pointer-events:none;}

.divider{display:flex;align-items:center;gap:10px;color:var(--gold-d);font-size:11px;letter-spacing:.3em;margin:16px 0;font-family:var(--f-sym);}
.divider::before,.divider::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line-s),transparent);}
.divider > span{font-family:var(--f-sym);}

.btn{background:transparent;border:1px solid var(--line-s);color:var(--text);
  font-family:var(--f-cn);font-size:calc(13px * var(--font-scale));letter-spacing:.18em;
  padding:13px 20px;cursor:pointer;transition:all .3s var(--ease);position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(201,169,97,.15),transparent);transform:translateX(-100%);transition:transform .55s var(--ease);}
.btn:hover::before{transform:translateX(100%);}
.btn:hover,.btn:active{border-color:var(--gold);color:var(--gold-b);background:rgba(201,169,97,.1);box-shadow:0 0 22px rgba(201,169,97,.25);letter-spacing:.22em;}
.btn.primary{border-color:var(--gold);color:var(--gold-b);background:rgba(201,169,97,.08);}
.btn.ghost{border-color:var(--line);color:var(--text-d);font-size:calc(12px * var(--font-scale));padding:9px 14px;}
.btn.danger{border-color:rgba(160,60,80,.6);color:#d08a9c;}
.btn.danger:hover{background:rgba(160,60,80,.15);border-color:#d08a9c;color:#ffb0c4;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.mini-btn{background:none;border:1px solid var(--line-s);color:var(--text-d);
  font-family:var(--f-cn);font-size:11px;letter-spacing:.08em;padding:6px 12px;cursor:pointer;transition:all .28s var(--ease);}
.mini-btn:hover{border-color:var(--gold);color:var(--gold-b);background:rgba(201,169,97,.08);}
.mini-btn.danger{border-color:rgba(160,60,80,.5);color:#c07a92;}
.mini-btn.danger:hover{background:rgba(160,60,80,.15);border-color:#d08a9c;color:#ffb0c4;}

.inp{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line-s);color:var(--gold-b);
  font-family:var(--f-cn);font-size:14px;padding:11px 14px;letter-spacing:.06em;outline:none;transition:all .28s var(--ease);}
[data-theme="day"] .inp{background:rgba(255,255,255,.6);}
.inp:focus{border-color:var(--gold);box-shadow:0 0 16px rgba(201,169,97,.22);}
.inp::placeholder{color:var(--text-d);font-size:12.5px;}
select.inp{cursor:pointer;}

#screen-title{align-items:center;justify-content:center;padding:24px;}
.title-card{position:relative;max-width:560px;width:100%;padding:52px 34px 42px;text-align:center;
  border:1px solid var(--line-s);background:linear-gradient(165deg,rgba(28,20,40,.85),rgba(12,8,18,.95));
  box-shadow:0 0 80px rgba(0,0,0,.9),inset 0 0 90px rgba(201,169,97,.04);max-height:94vh;overflow-y:auto;
  animation:titleIn 1s var(--ease) both;}
@keyframes titleIn{from{opacity:0;transform:scale(.94) translateY(14px);}to{opacity:1;transform:none;}}
[data-theme="day"] .title-card{background:linear-gradient(165deg,rgba(255,250,240,.95),rgba(248,240,220,.95));box-shadow:0 0 60px rgba(120,100,60,.2);}
.title-card .corner{position:absolute;font-family:var(--f-sym);font-size:16px;color:var(--gold);opacity:.9;transition:all .4s var(--ease);}
.title-card .corner.tl{top:8px;left:12px;}
.title-card .corner.tr{top:8px;right:12px;}
.title-card .corner.bl{bottom:8px;left:12px;}
.title-card .corner.br{bottom:8px;right:12px;}
.title-card:hover .corner{opacity:1;transform:scale(1.1);}
.title-eyebrow{font-family:var(--f-deco);font-size:11px;letter-spacing:.42em;color:var(--gold-d);margin-bottom:22px;}
.title-main{font-family:var(--f-deco);font-size:clamp(40px,13vw,68px);letter-spacing:.12em;
  color:var(--gold-b);text-shadow:0 0 30px rgba(201,169,97,.55),0 0 70px rgba(139,47,79,.3);
  font-weight:900;line-height:1.05;margin-bottom:12px;}
.title-sub{font-family:var(--f-en);font-style:italic;font-size:14px;color:var(--gold-d);letter-spacing:.05em;margin-bottom:6px;}
.title-actions{display:flex;flex-direction:column;gap:11px;max-width:290px;margin:30px auto 0;}
.title-foot{margin-top:28px;font-size:11px;letter-spacing:.16em;color:var(--text-d);font-style:italic;font-family:var(--f-en);}
.title-foot::before{content:'— ';color:var(--gold-d);}
.title-foot::after{content:' —';color:var(--gold-d);}

.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:calc(var(--safe-t) + 10px) 12px 10px;height:calc(52px + var(--safe-t));
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border-bottom:1px solid var(--line);position:relative;z-index:20;}
.topbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-s),transparent);}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:0;}
.tb-mark{width:16px;height:16px;border:1px solid var(--gold);transform:rotate(45deg);position:relative;flex-shrink:0;transition:transform .5s var(--ease);}
.tb-mark::after{content:'';position:absolute;inset:3px;background:var(--gold);opacity:.65;}
.tb-mark:hover{transform:rotate(225deg);}
.tb-title{font-family:var(--f-deco);font-size:13px;letter-spacing:.18em;color:var(--gold-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-loc{font-size:11px;letter-spacing:.14em;color:var(--text-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center;min-width:0;}
.tb-right{display:flex;gap:4px;flex-shrink:0;}
.tb-btn{background:none;border:1px solid var(--line-s);color:var(--gold);font-family:var(--f-cn);font-size:10.5px;letter-spacing:.06em;padding:5px 8px;cursor:pointer;transition:all .28s var(--ease);}
.tb-btn:hover{color:var(--gold-b);border-color:var(--gold);background:rgba(201,169,97,.1);}

#screen-game{display:none;flex-direction:column;}
#screen-game.active{display:flex;}
.stage{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 48px);}
.scene-bg{position:absolute;inset:0;transition:background 1s var(--ease);z-index:0;}
.bg-city{background:linear-gradient(180deg,#0e0a16 0%,#1a1224 40%,#2a1c30 100%);}
.bg-city::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 80%,rgba(201,169,97,.18),transparent 40%),radial-gradient(circle at 80% 70%,rgba(201,169,97,.14),transparent 40%);}
.bg-tavern{background:linear-gradient(180deg,#1a1010 0%,#2a1810 50%,#1a0e08 100%);}
.bg-tavern::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(230,160,80,.25),transparent 50%),radial-gradient(circle at 20% 90%,rgba(160,80,40,.2),transparent 45%);}
.bg-grove{background:linear-gradient(180deg,#1a1408 0%,#2e2410 50%,#1e1808 100%);}
.bg-grove::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(220,180,80,.22),transparent 60%);}
.bg-manor{background:linear-gradient(180deg,#0a0e18 0%,#141a28 50%,#0c1018 100%);}
.bg-manor::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(180,200,240,.18),transparent 50%);}
.bg-archive{background:linear-gradient(180deg,#100c08 0%,#1e160c 50%,#0e0a06 100%);}
.bg-archive::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 40% 40%,rgba(200,160,80,.15),transparent 55%);}
.bg-church{background:linear-gradient(180deg,#0c0818 0%,#1a1028 50%,#0a0614 100%);}
.bg-church::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,rgba(120,80,200,.28),transparent 50%),radial-gradient(circle at 50% 80%,rgba(200,60,80,.18),transparent 55%);}
.bg-castle{background:linear-gradient(180deg,#060810 0%,#0e1420 50%,#080a14 100%);}
.bg-castle::before{content:'';position:absolute;inset:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.04) 0deg 90deg,transparent 90deg 180deg),
             radial-gradient(circle at 50% 50%,rgba(200,200,255,.15),transparent 60%);
  background-size:80px 80px,100% 100%;}
.bg-dream{background:linear-gradient(180deg,#0c0418 0%,#1e0a28 50%,#080210 100%);}
.bg-dream::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(120,60,180,.35),transparent 45%),radial-gradient(circle at 70% 70%,rgba(80,20,140,.3),transparent 50%);animation:dreamPulse 8s ease-in-out infinite;}
@keyframes dreamPulse{0%,100%{opacity:.8;}50%{opacity:1;}}
[data-theme="day"] .scene-bg{filter:brightness(1.55) saturate(.75);}
[data-theme="day"] .scene-bg::before{opacity:.22;}
[data-theme="day"] .bg-city{background:linear-gradient(180deg,#e8dcc4 0%,#d8c8a8 40%,#c8b898 100%);}
[data-theme="day"] .bg-tavern{background:linear-gradient(180deg,#f0e0c8 0%,#e8d0b0 50%,#d8c0a0 100%);}
[data-theme="day"] .bg-grove{background:linear-gradient(180deg,#f0e8c8 0%,#e8dcb0 50%,#d8c890 100%);}
[data-theme="day"] .bg-manor{background:linear-gradient(180deg,#e0e4ec 0%,#d0d8e8 50%,#c0c8d8 100%);}
[data-theme="day"] .bg-archive{background:linear-gradient(180deg,#ede0c8 0%,#ddcfa8 50%,#c8b898 100%);}
[data-theme="day"] .bg-church{background:linear-gradient(180deg,#e8e0f0 0%,#d8cce8 50%,#c8b8d8 100%);}
[data-theme="day"] .bg-castle{background:linear-gradient(180deg,#e8eaf0 0%,#d8dce8 50%,#c8cce0 100%);}
[data-theme="day"] .bg-dream{background:linear-gradient(180deg,#ece0f8 0%,#dcd0ec 50%,#c8b8d8 100%);}

.loc-bar{flex:0 0 auto;padding:8px 18px;font-size:11px;letter-spacing:.22em;color:var(--gold-d);
  background:linear-gradient(180deg,rgba(25,17,36,.75),rgba(15,10,22,.25));
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:relative;z-index:2;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.loc-bar::before{content:'◈';font-family:var(--f-sym);font-size:9px;}
[data-theme="day"] .loc-bar{background:linear-gradient(180deg,rgba(255,252,245,.94),rgba(246,236,212,.78));color:var(--gold-d);}

.dialog-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 22px 18px;position:relative;z-index:2;scroll-behavior:smooth;}
.dialog-scroll::-webkit-scrollbar{width:4px;}
.dialog-scroll::-webkit-scrollbar-thumb{background:var(--line-s);}
.dialog-inner{max-width:760px;margin:0 auto;padding:20px 22px 24px;background:rgba(10,8,16,.55);border:1px solid var(--line);position:relative;}
[data-theme="day"] .dialog-inner{background:rgba(255,252,245,.92);}
.dialog-inner::before{content:'❖';position:absolute;top:-7px;left:-7px;font-family:var(--f-sym);font-size:11px;color:var(--gold);opacity:.85;}
.dialog-inner::after{content:'❖';position:absolute;bottom:-7px;right:-7px;font-family:var(--f-sym);font-size:11px;color:var(--gold);opacity:.85;}

.line{margin-bottom:22px;animation:lineIn .5s var(--ease) both;}
@keyframes lineIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.line .speaker{font-family:var(--f-deco);font-size:11px;letter-spacing:.2em;color:var(--gold-b);
  margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.line .speaker::before{content:'';width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex-shrink:0;
  box-shadow:0 0 8px rgba(201,169,97,.75);}
.line .en{font-family:var(--f-en);font-style:italic;font-weight:600;
  font-size:calc(17px * var(--font-scale));line-height:1.6;color:var(--gold-b);
  letter-spacing:.01em;margin-bottom:8px;}
.line .cn{font-size:calc(14.5px * var(--font-scale));line-height:1.95;color:var(--text);
  letter-spacing:.01em;padding-left:14px;border-left:2px solid var(--line);word-break:break-word;}
.line.narration .cn{color:var(--text-d);font-style:italic;}
.line.monologue .cn{color:#b8a8c8;font-style:italic;}
[data-theme="day"] .line.monologue .cn{color:#6a4a8c;}

.cont-hint{position:absolute;right:26px;bottom:calc(var(--nav-h) + var(--safe-b) + 58px);color:var(--gold);font-size:14px;opacity:.8;animation:bounce 1.6s infinite;pointer-events:none;z-index:5;font-family:var(--f-sym);}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.35;}50%{transform:translateY(6px);opacity:.9;}}

.choices{position:relative;z-index:3;padding:0 20px 14px;max-height:44vh;overflow-y:auto;display:none;}
.choices.active{display:block;animation:choiceIn .5s var(--ease);}
@keyframes choiceIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.choices-inner{max-width:760px;margin:0 auto;}
.choice-head{font-size:10.5px;letter-spacing:.4em;color:var(--gold-d);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.choice-head::before,.choice-head::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line-s),transparent);}
.choice-btn{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:linear-gradient(90deg,rgba(201,169,97,.06),transparent);border:1px solid var(--line-s);color:var(--text);font-family:var(--f-cn);font-size:calc(14px * var(--font-scale));line-height:1.7;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:all .32s var(--ease);position:relative;overflow:hidden;}
.choice-btn::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);transform:scaleY(0);transition:transform .32s var(--ease);}
.choice-btn:hover,.choice-btn:active{background:linear-gradient(90deg,rgba(201,169,97,.18),transparent);border-color:var(--gold);transform:translateX(5px);color:var(--gold-b);box-shadow:0 0 22px rgba(201,169,97,.16);}
.choice-btn:hover::after{transform:scaleY(1);}
.choice-idx{color:var(--gold);font-size:13px;flex-shrink:0;margin-top:1px;font-family:var(--f-sym);}

.story-tools{
  position:absolute;
  bottom:calc(var(--nav-h) + var(--safe-b));
  left:0;
  right:0;
  z-index:80;
  padding:8px 10px;
  background:rgba(22,18,31,.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;
  gap:4px;
  overflow-x:auto;
}
[data-theme="day"] .story-tools{
  background:rgba(255,252,242,.94);
}
.story-tools::-webkit-scrollbar{display:none;}
.story-tools button{flex:1;min-width:52px;padding:8px 4px;font-family:var(--f-cn);font-size:10px;letter-spacing:.06em;background:transparent;border:1px solid var(--line-s);color:var(--text-d);cursor:pointer;transition:all .28s var(--ease);white-space:nowrap;}
.story-tools button:hover{color:var(--gold-b);border-color:var(--gold);background:rgba(201,169,97,.08);}
.story-tools button.active{background:rgba(201,169,97,.18);color:var(--gold-b);border-color:var(--gold);}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-around;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:linear-gradient(0deg,var(--panel),var(--panel2));border-top:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.bottom-nav::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--line-s),transparent);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--text-d);font-family:var(--f-cn);cursor:pointer;padding:8px 4px;transition:all .28s var(--ease);position:relative;}
.nav-btn .nav-ico{font-size:17px;line-height:1;transition:all .28s var(--ease);font-family:var(--f-sym);}
.nav-btn .nav-lbl{font-size:9.5px;letter-spacing:.14em;}
.nav-btn:hover{color:var(--gold);}
.nav-btn.active{color:var(--gold-b);}
.nav-btn.active .nav-ico{transform:translateY(-2px);text-shadow:0 0 14px rgba(201,169,97,.75);}
.nav-btn.active::after{content:'';position:absolute;bottom:calc(var(--safe-b) + 3px);left:50%;transform:translateX(-50%);width:18px;height:2px;background:var(--gold);box-shadow:0 0 8px rgba(201,169,97,.8);}

#screen-map{display:none;flex-direction:column;}
#screen-map.active{display:flex;}
.map-main{flex:1;overflow-y:auto;padding:20px 16px calc(var(--nav-h) + var(--safe-b) + 20px);}
.map-region{margin-bottom:28px;}
.map-region-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-family:var(--f-deco);font-size:13px;letter-spacing:.22em;color:var(--gold-b);}
.map-region-head::before{content:'◆';color:var(--gold);font-size:10px;font-family:var(--f-sym);}
.map-region-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line-s),transparent);}
.map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}

.ws-pack::after{content:'❖';position:absolute;bottom:-6px;right:-6px;font-family:var(--f-sym);font-size:11px;color:var(--gold);opacity:.85;}
.ws-pack-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.ws-pack-title{font-size:13.5px;color:var(--gold-b);letter-spacing:.1em;}
.ws-pack-meta{font-size:11px;color:var(--text-d);letter-spacing:.06em;line-height:1.7;}
.ws-pack-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.ws-intro{font-size:12.5px;line-height:1.95;color:var(--text-d);margin-bottom:20px;padding:14px 16px;background:rgba(201,169,97,.04);border-left:2px solid rgba(201,169,97,.35);}
.ws-intro b{color:var(--gold-b);font-weight:400;}

.modal-layer{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(4,2,7,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
[data-theme="day"] .modal-layer{background:rgba(60,50,30,.55);}
.modal-layer.open{display:flex;animation:fadeIn .3s var(--ease);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{position:relative;width:100%;max-width:580px;max-height:88vh;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line-s);display:flex;flex-direction:column;box-shadow:0 0 70px rgba(0,0,0,.9),inset 0 0 70px rgba(201,169,97,.03);animation:modalIn .5s var(--ease);}
.modal.wide{max-width:820px;}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(16px);}to{opacity:1;transform:none;}}
.modal::before,.modal::after{content:'❖';position:absolute;font-family:var(--f-sym);font-size:12px;color:var(--gold);opacity:.9;pointer-events:none;}
.modal::before{top:-7px;left:-7px;}
.modal::after{bottom:-7px;right:-7px;}
.modal-head{flex:0 0 auto;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.modal-title{font-family:var(--f-deco);font-size:14px;letter-spacing:.24em;color:var(--gold-b);}
.modal-close{background:none;border:1px solid var(--line-s);color:var(--text-d);width:34px;height:34px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .28s var(--ease);flex-shrink:0;}
.modal-close:hover{color:var(--gold-b);border-color:var(--gold);background:rgba(201,169,97,.1);transform:rotate(90deg);}
.modal-body{flex:1;overflow-y:auto;padding:20px 22px;}
.modal-body::-webkit-scrollbar{width:4px;}
.modal-body::-webkit-scrollbar-thumb{background:var(--line-s);}
.modal-foot{flex:0 0 auto;padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

.toast-layer{position:fixed;top:calc(var(--safe-t) + 64px);left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:440px;}
.toast{background:linear-gradient(90deg,rgba(28,20,40,.96),rgba(20,14,30,.96));border:1px solid var(--line-s);color:var(--gold-b);font-size:12px;letter-spacing:.1em;padding:12px 20px;box-shadow:0 0 26px rgba(0,0,0,.7);animation:toastIn .4s var(--ease);text-align:center;line-height:1.7;max-width:100%;}
[data-theme="day"] .toast{background:linear-gradient(90deg,rgba(255,250,240,.98),rgba(245,235,215,.98));}
.toast.ok{border-color:rgba(120,180,120,.6);color:#4a8a50;}
.toast.warn{border-color:rgba(160,60,80,.7);color:#d08a9c;}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:none;}}
.toast.out{animation:toastOut .35s var(--ease) forwards;}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px);}}

.mini-title{text-align:center;font-family:var(--f-deco);font-size:15px;letter-spacing:.2em;color:var(--gold-b);margin-bottom:8px;}
.mini-sub{text-align:center;font-size:11px;color:var(--text-d);letter-spacing:.1em;margin-bottom:18px;line-height:1.7;}

.evidence-area{position:relative;height:340px;touch-action:none;}

.chess-cell.valid{background:rgba(201,169,97,.15);border-color:var(--gold);cursor:pointer;}

.puzzle-stage{position:relative;width:280px;height:280px;margin:0 auto;border:2px solid var(--line-s);background:rgba(0,0,0,.4);overflow:hidden;touch-action:none;}

.puzzle-tile.empty{background:transparent;border:none;cursor:default;}
.dice-area{text-align:center;padding:16px 0;}
.dice{width:100px;height:100px;margin:0 auto 18px;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--f-deco);font-size:42px;color:var(--gold-b);background:radial-gradient(circle,rgba(201,169,97,.15),transparent);box-shadow:0 0 30px rgba(201,169,97,.3);}
.battle-bar{margin-bottom:12px;}
.battle-name{font-size:12px;color:var(--text);letter-spacing:.1em;margin-bottom:6px;display:flex;justify-content:space-between;}
.battle-track{height:8px;background:rgba(0,0,0,.4);border:1px solid var(--line);position:relative;}
.battle-fill{height:100%;transition:width .5s var(--ease);background:linear-gradient(90deg,#8b2f4f,#d08a9c);}
.battle-fill.san{background:linear-gradient(90deg,#4a2b5e,#a78bd0);}
.battle-fill.hp{background:linear-gradient(90deg,#7a2f2f,#c07a92);}

.ending-card{text-align:center;padding:16px 6px;}
.ending-card .e-icon{font-size:34px;color:var(--gold);margin-bottom:18px;display:block;animation:pulse 2.4s infinite;font-family:var(--f-sym);}
@keyframes pulse{0%,100%{opacity:.6;}50%{opacity:1;}}
.ending-card .e-title{font-family:var(--f-deco);font-size:22px;color:var(--gold-b);letter-spacing:.28em;margin-bottom:10px;}
.ending-card .e-sub{font-family:var(--f-en);font-style:italic;font-size:12px;color:var(--gold-d);letter-spacing:.2em;margin-bottom:22px;}
.ending-card .e-desc{font-size:14px;line-height:2;color:var(--text);text-align:left;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 4px;margin-bottom:18px;}
.empty{text-align:center;padding:44px 20px;color:var(--text-d);font-size:13px;font-style:italic;letter-spacing:.08em;line-height:2;}

@media (max-width:420px){

  .map-grid{grid-template-columns:repeat(3,1fr);}
}

'use strict';

window.addEventListener('error', function(ev){
  try {
    var layer = document.getElementById('toastLayer');
    if (!layer) return;
    var el = document.createElement('div');
    el.className = 'toast warn';
    el.textContent = '脚本错误：' + (ev.message || '未知');
    layer.appendChild(el);
    setTimeout(function(){ el.classList.add('out'); setTimeout(function(){el.remove();}, 400); }, 5000);
  } catch(e){}
});
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const HAS_GSAP = () => !!(window.gsap && !window.__gsapFailed);
function animIn(el, from, to){ if (!el) return; if (HAS_GSAP() && settings.animations) { try{gsap.fromTo(el,from,to);}catch(e){el.style.opacity=1;} } else { el.style.opacity=1; el.style.transform='none'; } }
function animOut(el, to, cb){ if (!el){cb&&cb();return;} if (HAS_GSAP() && settings.animations) { try{gsap.to(el,Object.assign({},to,{onComplete:cb}));}catch(e){el.style.opacity=0;cb&&cb();} } else { el.style.opacity=0; cb&&cb(); } }

let settings = Object.assign({}, defaultSettings);

function applySettings(){
  try {
    const theme = (settings.theme === 'day' || settings.theme === 'night') ? settings.theme : 'night';
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.setProperty('--font-scale', settings.fontSize);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'day' ? '#f0e6d0' : '#0a0810');
  } catch(e){}
}

const Sfx = {
  ctx:null,
  init(){ if (this.ctx) return; try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} },
  ensure(){ if (!this.ctx) this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); },
  vol(){ return settings.sfxOn ? clamp(settings.sfxVol/100, 0, 1) : 0; },
  tone(freq, dur, type='sine', vol=0.15, sweep=null){
    this.ensure(); if (!this.ctx) return;
    const v = this.vol() * vol; if (v <= 0) return;
    try {
      const t = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t);
      if (sweep) osc.frequency.exponentialRampToValueAtTime(sweep, t + dur);
      gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(v, t+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t+dur+0.05);
    } catch(e){}
  },
  noise(dur=0.12, vol=0.15){
    this.ensure(); if (!this.ctx) return;
    const v = this.vol()*vol; if (v<=0) return;
    try {
      const t = this.ctx.currentTime;
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate*dur, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(v, t); gain.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      const filter = this.ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=2000;
      src.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
      src.start(t);
    } catch(e){}
  },
  click(){ this.tone(720, 0.06, 'triangle', 0.1); },
  page(){ this.noise(0.1, 0.1); },
  success(){ this.tone(523, 0.12, 'sine', 0.15); setTimeout(()=>this.tone(659,0.12,'sine',0.15),80); setTimeout(()=>this.tone(784,0.22,'sine',0.15),160); },
  fail(){ this.tone(220, 0.18, 'sawtooth', 0.12, 110); setTimeout(()=>this.tone(160,0.28,'sawtooth',0.1,80),120); },
  dice(){ for (let i=0;i<5;i++) setTimeout(()=>this.noise(0.05,0.06), i*55); },
  hit(){ this.tone(90, 0.16, 'square', 0.14, 50); this.noise(0.08, 0.1); },
  unlock(){ this.tone(880, 0.1, 'sine', 0.12); setTimeout(()=>this.tone(1047,0.18,'sine',0.12),70); }
};
function vibrate(ms){ if (settings.shake && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

function toast(msg, type='', dur=2400){
  const layer = $('#toastLayer'); if (!layer) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  layer.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 380); }, dur);
}

let modalStack = [];
function openModal(opt){
  const layer = $('#modalLayer'); if (!layer) return {el:null, close(){}};
  const wrap = document.createElement('div');
  wrap.className = 'modal' + (opt.wide ? ' wide' : '');
  wrap.innerHTML =
    '<div class="modal-head"><div class="modal-title">' + esc(opt.title||'') + '</div><button class="modal-close" aria-label="关闭">×</button></div>' +
    '<div class="modal-body">' + (opt.body||'') + '</div>' +
    (opt.footHTML ? '<div class="modal-foot">' + opt.footHTML + '</div>' : '');
  layer.appendChild(wrap); layer.classList.add('open');
  modalStack.push(wrap);
  const close = () => closeModal(wrap);
  wrap.querySelector('.modal-close').onclick = () => { Sfx.click(); close(); };
  layer.onclick = (e) => { if (e.target === layer) { Sfx.click(); close(); } };
  if (opt.onMount) { try { opt.onMount(wrap); } catch(e){ console.warn('onMount', e); } }
  return { el: wrap, close };
}
function closeModal(el){
  const layer = $('#modalLayer'); if (!layer) return;
  const target = el || modalStack[modalStack.length-1];
  if (!target) { layer.classList.remove('open'); layer.innerHTML=''; modalStack=[]; return; }
  const idx = modalStack.indexOf(target);
  if (idx >= 0) modalStack.splice(idx, 1);
  target.remove();
  if (!modalStack.length) layer.classList.remove('open');
}
function closeAllModals(){
  const layer = $('#modalLayer'); if (!layer) return;
  layer.classList.remove('open'); layer.innerHTML=''; modalStack = [];
}

const BUILTIN_CHAPTERS = [
  { num: 0, name: '序章 · 开端', entry: 'prologue_user', end: '序章完', chapterKey: 'prologue' }
];

function parseChapterNum(title) {
  if (!title) return null;
  const t = String(title).trim();
  if (/^序章|^序幕|^prologue/i.test(t)) return 0;
  let m = t.match(/第\s*(\d+)\s*章/);
  if (m) return parseInt(m[1]);
  m = t.match(/[Cc]hapter\s*(\d+)/);
  if (m) return parseInt(m[1]);
  const cn = { '零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
  m = t.match(/第\s*([零一二三四五六七八九十]+)\s*章/);
  if (m) {
    const s = m[1];
    if (s.length === 1) return cn[s] !== undefined ? cn[s] : null;
    if (s.startsWith('十')) return 10 + (cn[s.slice(1)] || 0);
    if (s.endsWith('十')) return (cn[s[0]] || 0) * 10;
    if (s.includes('十')) { const parts = s.split('十'); return (cn[parts[0]] || 0) * 10 + (cn[parts[1]] || 0); }
  }
  return null;
}

function getChapterList() {
  const list = BUILTIN_CHAPTERS.map(c => ({ ...c }));
  (userContent.chapters || []).forEach(c => {
    if ((c.type || 'main') !== 'main') return;
    let num = c.chapterNum;
    if (num === null || num === undefined) num = parseChapterNum(c.title);
    if (num === null || num === undefined) return;
    const userCh = { num, name: c.title, entry: 'user_scene_' + c.key, end: 'user_scene_' + c.key, chapterKey: c.key, isUser: true, _c: c };
    const idx = list.findIndex(x => x.num === num);
    if (idx >= 0) list[idx] = userCh;
    else list.push(userCh);
  });
  list.sort((a, b) => a.num - b.num);
  return list;
}

function findNextChapterByNum(currentNum) {
  const list = getChapterList();
  const idx = list.findIndex(x => x.num === currentNum);
  if (idx < 0 || idx >= list.length - 1) return null;
  return list[idx + 1];
}

function showChapterEndDialog(chapterNum, chapterName) {
  const next = findNextChapterByNum(chapterNum);
  if (next) {
    const nextTitle = next.name;
    openModal({
      title: '章 节 完 成',
      body:
        '<div style="text-align:center;padding:22px 8px;">' +
          '<div style="font-size:34px;color:var(--gold);margin-bottom:16px;">✦</div>' +
          '<div style="font-family:var(--f-deco);font-size:18px;letter-spacing:.28em;color:var(--gold-b);margin-bottom:12px;text-indent:.28em;">' + esc(chapterName || '本章') + '　完</div>' +
          '<div style="font-size:12px;color:var(--text-d);line-height:2;">新的一章已经准备好。</div>' +
        '</div>',
      footHTML:
        '<button class="btn ghost" id="ceStay">留 在 原 地</button>' +
        '<button class="btn primary" id="ceNext">继续阅读 → ' + esc(nextTitle) + '</button>',
      onMount: (w) => {
        w.querySelector('#ceStay').onclick = () => { Sfx.click(); closeModal(w); showScreen('map'); };
        w.querySelector('#ceNext').onclick = () => {
          Sfx.success(); closeModal(w);
          setTimeout(() => {
            if (next.isUser && next._c) playUserChapter(next._c);
            else if (SCENES[next.entry]) playScene(next.entry);
            else toast('下一章入口丢失', 'warn');
          }, 150);
        };
      }
    });
  } else {
    openModal({
      title: '章 节 完 成',
      body:
        '<div style="text-align:center;padding:22px 8px;">' +
          '<div style="font-size:34px;color:var(--gold);margin-bottom:16px;">☽</div>' +
          '<div style="font-family:var(--f-deco);font-size:18px;letter-spacing:.28em;color:var(--gold-b);margin-bottom:12px;text-indent:.28em;">' + esc(chapterName || '本章') + '　完</div>' +
          '<div style="font-size:12px;color:var(--text-d);line-height:2;font-style:italic;">后续章节尚未更新。<br>你可以用「剧情工坊」写新的章节，<br>或先回到地图探索其他内容。</div>' +
        '</div>',
      footHTML: '<button class="btn primary" id="ceStay">留 在 原 地</button>',
      onMount: (w) => {
        w.querySelector('#ceStay').onclick = () => { Sfx.click(); closeModal(w); showScreen('map'); };
      }
    });
  }
}

function showScreen(name){
  const cur = document.querySelector('.screen.active');
  const nxt = document.getElementById('screen-' + name);
  if (!nxt) return;
  if (cur === nxt) { updateNav(name); return; }
  if (state) state.screen = name;
  const doSwap = () => {
    if (cur) { cur.classList.remove('active'); cur.style.opacity=''; }
    nxt.classList.add('active');
    nxt.style.opacity = '1';
    if (HAS_GSAP() && settings.animations) animIn(nxt, {opacity:0,y:10}, {opacity:1,y:0,duration:.35,ease:'power2.out'});
  };
  if (HAS_GSAP() && settings.animations && cur) animOut(cur, {opacity:0,duration:.2}, doSwap);
  else doSwap();
  const nav = $('#bottomNav');
  if (nav) nav.style.display = (name === 'title') ? 'none' : 'flex';
  updateNav(name);
  if (name === 'map') renderMap();
  if (name === 'bond') renderBondGrid();
  if (name === 'toc') renderTOC();
  if (name === 'log') renderLog();
  if (name === 'settings') renderSettings();
  if (name === 'workshop') { if (window.Workshop && window.Workshop.render) window.Workshop.render(); else { $('#wsMain').innerHTML = '<div class="empty">工坊加载中…</div>'; } }
}
function updateNav(name){ $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === name)); }

/* ═══════════════════════════════════════════════════════════
   §P 场景引擎（线性 + 分支双模式）
   ═══════════════════════════════════════════════════════════ */
let typingState = { active:false, timer:null, el:null, full:'' };
function stopTyping(){ if (typingState.timer) clearTimeout(typingState.timer); typingState.active=false; if (typingState.el) typingState.el.textContent = typingState.full; }
function typeInto(el, text, cb){
  if (!el) { cb&&cb(); return; }
  stopTyping();
  typingState.el = el; typingState.full = text;
  el.textContent = '';
  if (settings.textSpeed <= 0) { el.textContent = text; typingState.active=false; cb&&cb(); return; }
  let i = 0; typingState.active = true;
  const step = () => {
    if (!typingState.active) return;
    if (i >= text.length) { typingState.active = false; cb&&cb(); return; }
    el.textContent += text.charAt(i++);
    typingState.timer = setTimeout(step, settings.textSpeed);
  };
  step();
}

function playScene(sceneId, opts){
  const scene = SCENES[sceneId];
  if (!scene) { toast('场景不存在：' + sceneId, 'warn'); return; }
  if (scene.set) {
    if (scene.set.aff) for (const k in scene.set.aff) state.affection[k] = (state.affection[k]||0) + scene.set.aff[k];
    for (const k in scene.set) if (k !== 'aff') state.flags[k] = scene.set[k];
  }
  state.sceneId = sceneId;
  state.lineIdx = 0;
  state.awaitingChoice = false;
  state.snapshots = [];
  state.choiceMarkers = [];
  state.log = state.log || [];
  showScreen('game');
  const bg = $('#sceneBg');
  if (bg) bg.className = 'scene-bg bg-' + (scene.bg || 'city');
  if ($('#locLabel')) $('#locLabel').textContent = scene.loc || '未知之地';
  if ($('#gameTopLoc')) $('#gameTopLoc').textContent = scene.chapter || scene.loc || '——';
  if ($('#dialogInner')) $('#dialogInner').innerHTML = '';
  if ($('#choices')) $('#choices').classList.remove('active');
  if ($('#choicesInner')) $('#choicesInner').innerHTML = '';
  if ($('#contHint')) $('#contHint').style.display = 'none';

  if (scene.branches) {
    state.branchKey = (opts && opts.branchKey) || 'main';
    state.branchIdx = (opts && opts.branchIdx) || 0;
    renderBranchLine();
  } else {
    renderLine(0);
  }
  saveNow();
}

function resolveLine(line){
  const pers = state?.player?.personality || '冷静';
  const gender = state?.player?.gender || '不限';
  let cn = line.cn, me = line.me;
  if (line.byPers && line.byPers[pers]) { if (line.me) me = line.byPers[pers]; else cn = line.byPers[pers]; }
  if (line.byGender && line.byGender[gender]) cn = line.byGender[gender];
  const nick = state?.player?.nick || '记者';
  const name = state?.player?.name || '记者';
  const replace = txt => txt ? txt.replace(/\[nick\]/g, nick).replace(/\[name\]/g, name) : txt;
  return { ...line, cn: replace(cn), me: replace(me) };
}

function renderLine(idx){
  const scene = SCENES[state.sceneId];
  if (!scene) return;
  const lines = scene.lines || [];
  if (idx >= lines.length) {
    if (scene.choices && scene.choices.length) {
      pushSnapshot(); state.choiceMarkers.push(state.snapshots.length - 1);
      showChoices(scene.choices); saveNow(); return;
    }
    if (scene.next) { pushSnapshot(); setTimeout(()=>playScene(scene.next), 200); return; }
    if (scene.onEnd) { scene.onEnd(); return; }
    showScreen('map');
    return;
  }
  state.lineIdx = idx;
  const raw = lines[idx];
  const line = resolveLine(raw);
  const inner = $('#dialogInner');
  if (!inner) return;
  const div = document.createElement('div');
  div.className = 'line';
  if (line.s) {
    const ch = CHARS[line.who] || { name: line.s, en:'' };
    const charEn = (CHARS[line.who] && CHARS[line.who].en) || '';
    div.innerHTML = '<div class="speaker">' + esc(ch.name) + (charEn ? ' · ' + esc(charEn) : '') + '</div>' +
                    (line.en ? '<div class="en">' + esc(line.en) + '</div>' : '') +
                    '<div class="cn"></div>';
    inner.appendChild(div);
    typeInto(div.querySelector('.cn'), line.cn || '', onLineDone);
    pushLog(ch.name, line.cn, line.en);
  } else if (line.me) {
    div.classList.add('monologue');
    div.innerHTML = (line.en ? '<div class="en">' + esc(line.en) + '</div>' : '') + '<div class="cn"></div>';
    inner.appendChild(div);
    typeInto(div.querySelector('.cn'), line.me, onLineDone);
    pushLog('我', line.me, line.en);
  } else {
    div.classList.add('narration');
    div.innerHTML = '<div class="cn"></div>';
    inner.appendChild(div);
    typeInto(div.querySelector('.cn'), line.cn || '', onLineDone);
    pushLog('旁白', line.cn);
  }
  scrollToBottom();
  if ($('#contHint')) $('#contHint').style.display = 'none';
  saveNow();
}

let autoTimer = null;
function onLineDone(){
  const scene = SCENES[state.sceneId]; if (!scene) return;
  const hint = $('#contHint');
  if (scene.branches) {
    const node = scene.branches[state.branchKey] || [];
    const hasNext = state.branchIdx < node.length;
    if (hint) hint.style.display = hasNext ? 'block' : 'none';
  } else {
    const lines = scene.lines || [];
    const isLast = state.lineIdx >= lines.length - 1;
    if (hint) {
      if (isLast && (scene.choices || scene.next || scene.onEnd)) { if (!scene.choices) hint.style.display = 'block'; }
      else hint.style.display = 'block';
    }
  }
  if (settings.autoPlay) { clearTimeout(autoTimer); autoTimer = setTimeout(advanceLine, 2000); }
}

function advanceLine(){
  if (state?.screen !== 'game') return;
  if (typingState.active) { stopTyping(); onLineDone(); return; }
  const scene = SCENES[state.sceneId]; if (!scene) return;
  if (scene.branches) {
    if (state.awaitingChoice) return;
    Sfx.page();
    pushSnapshot();
    renderBranchLine();
    return;
  }
  if (scene.choices && scene.choices.length && state.lineIdx >= (scene.lines||[]).length - 1) { showChoices(scene.choices); return; }
  Sfx.page();
  renderLine(state.lineIdx + 1);
}

function scrollToBottom(){ const el = $('#dialogScroll'); if (!el) return; requestAnimationFrame(()=>{ el.scrollTop = el.scrollHeight; }); }

/* ★ 分支执行器 */
function renderBranchLine(){
  const scene = SCENES[state.sceneId];
  if (!scene || !scene.branches) return;
  const nodes = scene.branches;
  let key = state.branchKey;
  let idx = state.branchIdx;
  let node = nodes[key];
  if (!node) { finishUserChapter(); return; }

  let guard = 0;
  while (guard++ < 500) {
    // 处理效果
    while (idx < node.length && node[idx].type === 'effect') {
      applyBranchEffects(node[idx].effects);
      idx++;
      state.branchIdx = idx;
    }
    
    // ★ 新增：处理地点与背景切换
    while (idx < node.length && node[idx].type === 'env') {
      const env = node[idx];
      if (env.bg) {
        const bg = $('#sceneBg');
        if (bg) bg.className = 'scene-bg bg-' + env.bg;
      }
      if (env.loc) {
        if ($('#locLabel')) $('#locLabel').textContent = env.loc;
        if ($('#gameTopLoc')) $('#gameTopLoc').textContent = env.loc;
      }
      idx++;
      state.branchIdx = idx;
    }
    
    if (idx >= node.length) { 
      if (scene.onEnd) { scene.onEnd(); return; }
      finishUserChapter(); 
      return; 
    }
    const n = node[idx];

    if (n.type === 'jump') {
      const target = n.to;
      if (target === 'end' || target === '结束' || !nodes[target]) { finishUserChapter(); return; }
      key = target; state.branchKey = key;
      idx = 0; state.branchIdx = 0;
      node = nodes[key];
      if (!node) { finishUserChapter(); return; }
      continue;
    }

    if (n.type === 'choice') {
      const valid = n.choices.filter(c => !c.condition || c.condition(state));
      if (valid.length) { 
        pushSnapshot(); 
        state.choiceMarkers.push(state.snapshots.length - 1);
        showBranchChoices(valid, n); 
        return; 
      }
      idx++; state.branchIdx = idx;
      continue;
    }

    showBranchLineNode(n);
    state.branchIdx = idx + 1;
    scrollToBottom();
    return;
  }
  finishUserChapter();
}

function selectBranchChoice(c){
  state.awaitingChoice = false;
  $('#choices').classList.remove('active');
  $('#choicesInner').innerHTML = '';
  pushLog('▸ ' + c.text, 'choice');
  if (c.effects) applyBranchEffects(c.effects);
  saveNow();
  pushSnapshot();
  const scene = SCENES[state.sceneId];
  if (c.next && scene && scene.branches && scene.branches[c.next]) {
    state.branchKey = c.next;
    state.branchIdx = 0;
    renderBranchLine();
  } else {
    finishUserChapter();
  }
}

function applyBranchEffects(fx){
  if (!fx) return;
  if (fx.aff) for (const k in fx.aff) state.affection[k] = (state.affection[k] || 0) + fx.aff[k];
  if (fx.silver) state.stats.silver = (state.stats.silver || 0) + fx.silver;
  if (fx.flags) for (const k in fx.flags) state.flags[k] = true;
  if (fx.unlock) for (const key of fx.unlock) state.flags[key] = true;
  saveNow();
}

function finishUserChapter(){
  const scene = SCENES[state.sceneId];
  if (!scene) { showScreen('map'); return; }
  const c = userContent.chapters.find(x => 'user_scene_' + x.key === state.sceneId);
  const chapterKey = c?.key || state.sceneId;
  let chapterNum = c?.chapterNum;
  if (chapterNum === undefined && scene.chapterNum !== undefined) chapterNum = scene.chapterNum;
  if (chapterNum === undefined && scene.chapter) chapterNum = parseChapterNum(scene.chapter);
  
  globalData.completedChapters[chapterKey] = true;
  saveGlobal();
  Sfx.success();
  toast('◈ 完成：' + (scene.chapter || '章节'), 'ok');
  saveNow();
  setTimeout(() => {
    if (chapterNum !== null && chapterNum !== undefined) showChapterEndDialog(chapterNum, scene.chapter || c?.title || '章节');
    else showScreen('map');
  }, 400);
}

function pushSnapshot(){
  if (!state) return;
  state.snapshots.push({
    sceneId: state.sceneId, lineIdx: state.lineIdx,
    branchKey: state.branchKey, branchIdx: state.branchIdx,
    flags: JSON.parse(JSON.stringify(state.flags)),
    affection: JSON.parse(JSON.stringify(state.affection))
  });
  if (state.snapshots.length > 100) state.snapshots.shift();
}

function pushLog(speaker, cn, en){
  if (!state) return;
  state.log.push({ speaker, cn, en });
  if (state.log.length > 300) state.log.shift();
}

function rewindToLastChoice(){
  if (!state || !state.choiceMarkers.length) { toast('没有可回溯的选择点', 'warn'); return; }
  const marker = state.choiceMarkers.pop();
  const snap = state.snapshots[marker];
  if (!snap) { toast('快照丢失', 'warn'); return; }
  state.sceneId = snap.sceneId;
  state.lineIdx = snap.lineIdx;
  state.branchKey = snap.branchKey || 'main';
  state.branchIdx = snap.branchIdx || 0;
  state.flags = JSON.parse(JSON.stringify(snap.flags));
  state.affection = JSON.parse(JSON.stringify(snap.affection));
  state.awaitingChoice = false;
  state.snapshots = state.snapshots.slice(0, marker);
  playSceneFromSnapshot();
  toast('◈ 已回溯到上一个选择', 'ok');
}

function playSceneFromSnapshot(){
  const scene = SCENES[state.sceneId];
  if (!scene) return;
  showScreen('game');
  const bg = $('#sceneBg');
  if (bg) bg.className = 'scene-bg bg-' + (scene.bg || 'city');
  if ($('#locLabel')) $('#locLabel').textContent = scene.loc || '未知之地';
  if ($('#gameTopLoc')) $('#gameTopLoc').textContent = scene.chapter || scene.loc || '——';
  if ($('#dialogInner')) $('#dialogInner').innerHTML = '';
  if ($('#choices')) $('#choices').classList.remove('active');
  if ($('#choicesInner')) $('#choicesInner').innerHTML = '';

  if (scene.branches) {
    const key = state.branchKey || 'main';
    const node = scene.branches[key] || [];
    const upto = state.branchIdx || 0;
    for (let i = 0; i < upto && i < node.length; i++) {
      const n = node[i];
      if (n.type === 'narration' || n.type === 'me' || n.type === 'dialogue' || n.type === 'monologue') renderBranchLineNodeInstant(n);
    }
    scrollToBottom();
    saveNow();
    state.awaitingChoice = false;
    renderBranchLine(); // 关键修复：回溯恢复后，继续往下走，重新渲染选项
    return;
  }

  const lines = scene.lines || [];
  for (let i = 0; i <= Math.min(state.lineIdx, lines.length-1); i++) {
    const line = resolveLine(lines[i]);
    const div = document.createElement('div');
    div.className = 'line';
    if (line.s) { const ch = CHARS[line.who] || { name: line.s }; div.innerHTML = '<div class="speaker">' + esc(ch.name) + '</div>' + (line.en?'<div class="en">'+esc(line.en)+'</div>':'') + '<div class="cn">' + esc(line.cn) + '</div>'; }
    else if (line.me) { div.classList.add('monologue'); div.innerHTML = (line.en?'<div class="en">'+esc(line.en)+'</div>':'') + '<div class="cn">' + esc(line.me) + '</div>'; }
    else { div.classList.add('narration'); div.innerHTML = '<div class="cn">' + esc(line.cn) + '</div>'; }
    $('#dialogInner').appendChild(div);
  }
  if (scene.choices && state.lineIdx >= lines.length - 1) {
    state.awaitingChoice = false;
    showChoices(scene.choices);
  }
  scrollToBottom(); saveNow();
}

function playTopic(id, topic){
  const lines = topic.lines.map(l => {
    if (l.who === 'me') return { me: l.cn, en: l.en || '' };
    const ch = CHARS[l.who];
    return { s: ch ? ch.name : l.who, who: l.who, en: l.en || '', cn: l.cn };
  });
  const sceneId = '__topic_' + topic.key + '_' + Date.now();
  SCENES[sceneId] = {
    bg: 'tavern', loc: CHARS[id].name + ' · ' + (topic.mode==='deep'?'深谈':'闲聊'),
    chapter: CHARS[id].name + ' · 对话',
    lines,
    onEnd: () => {
      const topicKey = topic.key || ('tmp_' + Date.now());
      const d = new Date();
      const todayK = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
      if (!state.flags) state.flags = {};
      const topicFlagKey = '__topic_done_' + todayK + '_' + topicKey;
      if (state.flags[topicFlagKey]) {
        /* 今天已经聊过这个话题 —— 不给好感 */
        Sfx.click();
        toast('今天已经聊过这个话题了。改日再来吧。', 'warn');
        saveNow();
        setTimeout(()=>showScreen('bond'), 600);
        return;
      }
      state.flags[topicFlagKey] = true;
      const gain = topic.mode === 'deep' ? 5 : 3;
      const oldAff = state.affection[id] || 0;
      state.affection[id] = oldAff + gain;
      const oldLv = getLevel(oldAff), newLv = getLevel(state.affection[id]);
      if (newLv.name !== oldLv.name) showLevelUp(newLv, state.affection[id], CHARS[id].name);
      Sfx.unlock();
      toast('◈ 与 ' + CHARS[id].name + ' 的亲密 +' + gain + '（今日首谈）', 'ok');
      saveNow();
      setTimeout(()=>showScreen('bond'), 600);
    }
  };
  playScene(sceneId);
}

function openGiftPanel(id){
  const c = CHARS[id];
  const gifts = getAllGifts();
  let html = '<div style="margin-bottom:14px;font-size:11.5px;color:var(--text-d);letter-spacing:.06em;">选择礼物赠予 ' + esc(c.name) + '。喜欢的礼物能加更多好感。</div>';
  gifts.forEach(g => {
    const liked = (g.likes || []).includes(id);
    html += '<div class="gift-item" data-key="' + g.key + '">' +
      '<div class="gift-ico">' + (g.icon || '✦') + '</div>' +
      '<div class="gift-info">' +
        '<div class="gift-name">' + esc(g.name) + '</div>' +
        '<div class="gift-meta">银镑 ' + g.cost + ' · 好感 +' + (liked ? (g.aff * 2) + ' (喜欢)' : g.aff) + '</div>' +
        (liked ? '<div class="gift-like">◈ ' + esc(c.name) + ' 会喜欢这个</div>' : '') +
      '</div>' +
    '</div>';
  });
  openModal({
    title:'赠 礼 · ' + c.name,
    body: html,
    footHTML:'<button class="btn ghost" id="giftCancel">取消</button>',
    onMount: (w) => {
      w.querySelector('#giftCancel').onclick = () => { Sfx.click(); closeModal(w); };
      w.querySelectorAll('.gift-item').forEach(el => {
        el.onclick = () => {
          const key = el.dataset.key;
          const g = gifts.find(x => x.key === key);
          if (!g) return;
          if ((state.stats.silver || 0) < g.cost) { Sfx.fail(); toast('银镑不足','warn'); return; }
          state.stats.silver -= g.cost;
          const liked = (g.likes || []).includes(id);
          const gain = liked ? g.aff * 2 : g.aff;
          const oldAff = state.affection[id] || 0;
          state.affection[id] = oldAff + gain;
          Sfx.success(); closeModal(w);
          const reaction = liked ? '「……这个？」' + c.name + ' 看了你一眼，把礼物收下了。' : '「谢谢。」' + c.name + ' 礼貌地收下了。';
          const oldLv = getLevel(oldAff), newLv = getLevel(state.affection[id]);
          if (newLv.name !== oldLv.name) showLevelUp(newLv, state.affection[id], c.name);
          openModal({
            title:'赠 礼 成 功',
            body:'<div style="text-align:center;padding:20px 8px;">' +
              '<div style="font-size:40px;color:var(--gold);margin-bottom:14px;">' + (g.icon || '✦') + '</div>' +
              '<div style="font-size:13px;line-height:2;color:var(--text);">' + esc(reaction) + '<br>（亲密 +' + gain + '）</div>' +
              (liked ? '<div style="margin-top:14px;font-size:11px;color:#d0a0b0;letter-spacing:.1em;">◈ 送到了对方喜欢的东西</div>' : '') +
            '</div>',
            footHTML:'<button class="btn primary" onclick="(function(){var l=document.getElementById(\'modalLayer\');l.classList.remove(\'open\');l.innerHTML=\'\';})()">好的</button>'
          });
          saveNow();
        };
      });
    }
  });
}

function playCG(cg){
  const lines = cg.lines.map(l => {
    if (l.who === 'me') return { me: l.cn, en: l.en || '' };
    if (l.s) return { s: l.s, en: l.en || '', cn: l.cn };
    if (l.who) { const ch = CHARS[l.who]; return { s: ch ? ch.name : l.who, who: l.who, en: l.en || '', cn: l.cn }; }
    return { cn: l.cn };
  });
  const sceneId = '__cg_' + cg.key + '_' + Date.now();
  SCENES[sceneId] = {
    bg: 'tavern', loc: cg.title, chapter: cg.subtitle || '特殊剧情',
    lines,
    onEnd: () => { Sfx.unlock(); toast('◈ 特殊剧情已完成：' + cg.title, 'ok'); saveNow(); setTimeout(()=>showScreen('bond'), 600); }
  };
  playScene(sceneId);
}

let tocTab = 'main';
function renderTOC(){
  const tabs = $('#tocTabs'); if (!tabs) return;
  const tabList = [
    { id:'main', label:'主线' }, { id:'side', label:'支线 / 副本' },
    { id:'bond', label:'乙游话题' }, { id:'loc', label:'地点' }
  ];
  tabs.innerHTML = tabList.map(t => '<button class="toc-tab ' + (t.id===tocTab?'active':'') + '" data-tab="' + t.id + '">' + t.label + '</button>').join('');
  tabs.querySelectorAll('.toc-tab').forEach(b => { b.onclick = () => { Sfx.click(); tocTab = b.dataset.tab; renderTOC(); }; });
  const group = $('#tocGroup'); if (!group) return;
  group.innerHTML = '';

  if (tocTab === 'main') {
    const chapters = getChapterList();
    chapters.forEach(ch => {
      const done = !!globalData.completedChapters?.[ch.chapterKey];
      const isUser = !!ch.isUser;
      const el = document.createElement('div');
      el.className = 'toc-item';
      el.innerHTML =
        '<div class="toc-item-ico">' + (ch.num === 0 ? '☽' : '♕') + '</div>' +
        '<div class="toc-item-info">' +
          '<div class="toc-item-title">' + esc(ch.name) + (isUser ? ' <span style="font-size:10px;color:var(--gold-d);letter-spacing:.1em;">[自定]</span>' : '') + '</div>' +
          '<div class="toc-item-sub">第 ' + (ch.num === 0 ? '序' : ch.num) + ' 章</div>' +
        '</div>' +
        '<div class="toc-item-state ' + (done?'done':'') + '">' + (done?'已完成':'未开始') + '</div>';
      el.onclick = () => {
        Sfx.click();
        if (isUser && ch._c) playUserChapter(ch._c);
        else if (SCENES[ch.entry]) playScene(ch.entry);
        else toast('章节入口丢失','warn');
      };
      group.appendChild(el);
    });
    if ($('#tocSub')) $('#tocSub').textContent = '主线 ' + chapters.length + ' 章';
  } else if (tocTab === 'side') {
    const sides = userContent.chapters.filter(c => c.type === 'side' || c.type === 'dungeon');
    if (!sides.length) { group.innerHTML = '<div class="empty">还没有支线或副本。<br>去「剧情工坊」创建吧。</div>'; return; }
    sides.forEach(c => {
      const done = !!globalData.completedChapters?.[c.key];
      const el = document.createElement('div');
      el.className = 'toc-item';
      el.innerHTML = '<div class="toc-item-ico">' + (c.type==='dungeon'?'☽':'✦') + '</div>' +
        '<div class="toc-item-info"><div class="toc-item-title">' + esc(c.title) + '</div>' +
        '<div class="toc-item-sub">' + esc(c.subtitle || c.location || '') + '</div></div>' +
        '<div class="toc-item-state ' + (done?'done':'') + '">' + (c.type==='dungeon'?'副本':'支线') + '</div>';
      el.onclick = () => { Sfx.click(); playUserChapter(c); };
      group.appendChild(el);
    });
    if ($('#tocSub')) $('#tocSub').textContent = sides.length + ' 项';
  } else if (tocTab === 'bond') {
    const topics = getAllBondTopics();
    const byChar = {};
    topics.forEach(t => { if (!byChar[t.charId]) byChar[t.charId] = []; byChar[t.charId].push(t); });
    let any = false;
    for (const charId in byChar) {
      any = true;
      const c = CHARS[charId]; if (!c) continue;
      const aff = (state?.affection?.[charId]) || 0;
      const head = document.createElement('div');
      head.style.cssText = 'margin:16px 0 8px;font-family:var(--f-deco);font-size:12px;letter-spacing:.2em;color:var(--gold-b);';
      head.textContent = c.name + ' · 好感 ' + aff;
      group.appendChild(head);
      byChar[charId].forEach(t => {
        const unlocked = aff >= (t.need||0);
        const el = document.createElement('div');
        el.className = 'toc-item' + (unlocked?'':' locked');
        el.innerHTML = '<div class="toc-item-ico">' + (t.mode==='deep'?'♛':'♞') + '</div>' +
          '<div class="toc-item-info"><div class="toc-item-title">' + esc(t.title) + '</div>' +
          '<div class="toc-item-sub">' + (t.mode==='deep'?'深谈':'闲聊') + (unlocked?'':' · 好感 ' + t.need + ' 解锁') + '</div></div>';
        if (unlocked) el.onclick = () => { Sfx.click(); playTopic(charId, t); };
        group.appendChild(el);
      });
    }
    if (!any) group.innerHTML = '<div class="empty">还没有任何乙游话题。</div>';
    if ($('#tocSub')) $('#tocSub').textContent = topics.length + ' 个话题';
  } else if (tocTab === 'loc') {
    const locs = getAllLocations();
    locs.forEach(l => {
      const unlocked = isLocationUnlocked(l);
      const el = document.createElement('div');
      el.className = 'toc-item' + (unlocked?'':' locked');
      el.innerHTML = '<div class="toc-item-ico">' + getLocationIcon(l.key) + '</div>' +
        '<div class="toc-item-info"><div class="toc-item-title">' + esc(l.name) + '</div>' +
        '<div class="toc-item-sub">' + esc(l.region || '') + (unlocked?'':' · 未解锁') + '</div></div>';
      if (unlocked) el.onclick = () => { Sfx.click(); enterLocation(l); };
      group.appendChild(el);
    });
    if ($('#tocSub')) $('#tocSub').textContent = locs.length + ' 个地点';
  }
}

function playUserChapter(c){
  const sceneId = 'user_scene_' + c.key;
  if (!SCENES[sceneId]) {
    const hasBranches = c.branches && Object.keys(c.branches).length >= 1;
    if (hasBranches) {
      SCENES[sceneId] = {
        bg: c.bg || 'city',
        loc: c.location || c.title,
        chapter: c.title,
        chapterNum: c.chapterNum,
        branches: c.branches,
        lines: c.lines || []
      };
    } else {
      const lines = (c.lines || []).map(l => {
        if (l.type === 'n') return { cn: l.cn || '' };
        if (l.type === 's') { const ch = CHARS[l.who]; return { s: ch ? ch.name : (l.char||'？？？'), who: l.who, en: l.en || '', cn: l.cn || '' }; }
        if (l.type === 'me') return { me: l.cn || '', en: l.en || '' };
        return { cn: l.cn || '' };
      });
      const chapterNum = (c.chapterNum !== undefined && c.chapterNum !== null) ? c.chapterNum : parseChapterNum(c.title);
      SCENES[sceneId] = {
        bg: c.bg || 'city', loc: c.location || c.title, chapter: c.title, chapterNum,
        lines,
        onEnd: () => {
          globalData.completedChapters[c.key] = true;
          saveGlobal();
          toast('◈ 完成：' + c.title, 'ok');
          saveNow();
          setTimeout(() => {
            if (chapterNum !== null && chapterNum !== undefined) showChapterEndDialog(chapterNum, c.title);
            else { showScreen('map'); }
          }, 400);
        }
      };
    }
  }
  playScene(sceneId);
}

let logTab = 'char';
function renderLog(){

    { id:'char', label:'人物' }, { id:'story', label:'剧情' },

  tabsEl.querySelectorAll('.log-tab').forEach(b => { b.onclick = () => { Sfx.click(); logTab = b.dataset.tab; renderLog(); }; });
  const body = $('#logBody'); if (!body) return;

  if (logTab === 'char') {
    let html = '<div class="char-grid">';
    Object.keys(CHARS).forEach(id => {
      if (id === 'narrator' || id === 'me') return;
      const c = CHARS[id];
      const aff = (state?.affection?.[id]) || 0;
      const lv = getLevel(aff);
      html += '<div class="char-card">' +
        '<div class="char-head"><div class="char-avatar">' + c.sym + '</div>' +
        '<div><div class="char-name">' + esc(c.name) + '</div>' +
        '<div class="char-en">' + esc(c.en) + '</div>' +
        '<div class="char-title">' + esc(c.title || '') + '</div></div></div>' +

    });
    html += '</div>';
    body.innerHTML = html;
    if ($('#logSub')) $('#logSub').textContent = '已结识 ' + Object.keys(state?.affection || {}).length + ' 人';
  } else if (logTab === 'story') {
    if (!state?.log?.length) { body.innerHTML = '<div class="empty">还没有记录。</div>'; return; }
    body.innerHTML = state.log.slice().reverse().map(l => {
      if (l.type === 'choice') return '<div class="log-entry choice"><div class="le-cn">▸ ' + esc(l.text||l.cn||'') + '</div></div>';
      const en = l.en ? '<div class="le-en">' + esc(l.en) + '</div>' : '';
      return '<div class="log-entry"><span class="le-speaker">' + esc(l.speaker||'') + '</span>' + en + '<div class="le-cn">' + esc(l.cn||'') + '</div></div>';
    }).join('');
    if ($('#logSub')) $('#logSub').textContent = state.log.length + ' 条';
  } else if (logTab === 'intel') {
    body.innerHTML = INTEL_LIST.map(i => {
      const done = i.done(state);
      return '<div class="char-card" style="margin-bottom:10px;">' +
        '<div class="char-name" style="margin-bottom:6px;">' + (done ? '◈' : '◇') + ' ' + esc(i.name) + '</div>' +
        '<div class="char-desc" style="margin-top:0;padding-top:0;border:none;color:' + (done?'var(--text)':'var(--text-d)') + ';">' +
          (done ? esc(i.desc) : '尚未解锁。继续探索剧情与地点。') +
        '</div></div>';
    }).join('');
    if ($('#logSub')) $('#logSub').textContent = INTEL_LIST.filter(i => i.done(state)).length + ' / ' + INTEL_LIST.length;
  } else if (logTab === 'endings') {
    const all = Object.keys(CODEX.ending);
    const got = Object.keys(globalData.seenEndings || {});
    body.innerHTML = all.map(id => {
      const e = CODEX.ending[id];

      return '<div class="char-card" style="margin-bottom:10px;">' +
        '<div class="char-name" style="margin-bottom:6px;">' + (on ? '✦' : '◇') + ' ' + (on ? esc(e.name) : '？？？') + '</div>' +
        '<div class="char-desc" style="margin-top:0;padding-top:0;border:none;">' + (on ? esc(e.desc) : '尚未达成') + '</div>' +
      '</div>';
    }).join('');
    if ($('#logSub')) $('#logSub').textContent = got.length + ' / ' + all.length;
  }
}

function getSlots(){ try { return JSON.parse(localStorage.getItem(K_SLOTS) || '{}'); } catch(e){ return {}; } }
function setSlots(s){ try { localStorage.setItem(K_SLOTS, JSON.stringify(s)); } catch(e){} }

function openSaveManager(){
  const slots = getSlots();
  let html = '';
  for (let i = 1; i <= 3; i++) {
    const s = slots[i];
    if (s) {
      const t = new Date(s.ts);
      const time = t.getFullYear()+'/'+(t.getMonth()+1)+'/'+t.getDate()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
      html += '<div style="border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;background:rgba(201,169,97,.02);">' +
        '<div style="font-size:13px;color:var(--gold-b);letter-spacing:.1em;margin-bottom:4px;">存档 ' + i + ' · ' + esc(s.chapterTitle || '未知章节') + '</div>' +
        '<div style="font-size:10.5px;color:var(--text-d);letter-spacing:.04em;margin-bottom:4px;">' + time + ' · 银镑 ' + (s.silver||0) + '</div>' +
        (s.preview ? '<div style="font-size:11px;color:var(--gold-d);line-height:1.6;font-style:italic;">「' + esc(s.preview) + '」</div>' : '') +
        '<div style="display:flex;gap:6px;margin-top:8px;">' +
          '<button class="mini-btn" data-load="' + i + '">读取</button>' +
          '<button class="mini-btn" data-save="' + i + '">覆盖</button>' +
          '<button class="mini-btn danger" data-del="' + i + '">删除</button>' +
        '</div></div>';
    } else {
      html += '<div style="border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;background:rgba(201,169,97,.02);">' +
        '<div style="font-size:13px;color:var(--text-d);letter-spacing:.1em;font-style:italic;">存档 ' + i + ' · 空</div>' +
        '<div style="display:flex;gap:6px;margin-top:8px;"><button class="mini-btn" data-save="' + i + '">保存</button></div></div>';
    }
  }
  openModal({
    title:'存 档',
    body: html,
    footHTML:'<button class="btn ghost" id="svClose">关闭</button>',
    onMount: (w) => {
      w.querySelector('#svClose').onclick = () => { Sfx.click(); closeModal(w); };
      w.querySelectorAll('[data-save]').forEach(b => {
        b.onclick = () => {
          const slot = b.dataset.save;
          const slots2 = getSlots();
          const scene = state ? SCENES[state.sceneId] : null;
          const chapterTitle = scene?.chapter || scene?.loc || '';
          const preview = state?.log?.length ? (state.log[state.log.length-1].cn || '').slice(0, 40) : '';
          slots2[slot] = {
            ts: Date.now(), chapterTitle, silver: state?.stats?.silver || 0, preview,
            data: JSON.parse(JSON.stringify({
              uid: state.uid, player: state.player, stats: state.stats,
              affection: state.affection, flags: state.flags, readLines: state.readLines,
              log: state.log, sceneId: state.sceneId, lineIdx: state.lineIdx,
              branchKey: state.branchKey, branchIdx: state.branchIdx
            }))
          };
          setSlots(slots2); Sfx.success(); toast('◈ 已保存至存档 ' + slot,'ok');
          closeModal(w); setTimeout(openSaveManager, 200);
        };
      });
      w.querySelectorAll('[data-load]').forEach(b => {
        b.onclick = () => {
          const s = getSlots()[b.dataset.load];
          if (!s) return;
          state = newState(s.data.player?.name || '记者');
          Object.assign(state, JSON.parse(JSON.stringify(s.data)));
          saveNow(); Sfx.success(); closeModal(w);
          toast('◈ 已读取','ok');
          if (state.sceneId && SCENES[state.sceneId]) {
            if (SCENES[state.sceneId].branches) playSceneFromSnapshot();
            else playScene(state.sceneId);
          }
          else showScreen('map');
        };
      });
      w.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => { if (!confirm('确定删除？')) return; const slots2 = getSlots(); delete slots2[b.dataset.del]; setSlots(slots2); Sfx.click(); closeModal(w); setTimeout(openSaveManager, 200); };
      });
    }
  });
}

/* ★ 新增：读取工坊场景的引擎函数 */
function ensureSceneLoaded(sceneId) {
  if (!sceneId) return false;
  if (SCENES[sceneId]) return true;

  if (['prologue_1','prologue_2','prologue_3a','prologue_3b','prologue_3c','prologue_4','prologue_5','prologue_6','prologue_7','prologue_8'].includes(sceneId)) {
    state.sceneId = 'prologue_user';
    state.branchKey = 'main';
    state.branchIdx = 0;
    state.lineIdx = 0;
    return true;
  }

  if (sceneId.startsWith('user_scene_')) {
    const key = sceneId.replace('user_scene_', '');
    const c = userContent.chapters.find(x => x.key === key);
    if (c) {
      const hasBranches = c.branches && Object.keys(c.branches).length >= 1;
      if (hasBranches) {
        SCENES[sceneId] = {
          bg: c.bg || 'city',
          loc: c.location || c.title,
          chapter: c.title,
          chapterNum: c.chapterNum,
          branches: c.branches,
          lines: c.lines || []
        };
      } else {
        const lines = (c.lines || []).map(l => {
          if (l.type === 'n') return { cn: l.cn || '' };
          if (l.type === 's') { const ch = CHARS[l.who]; return { s: ch ? ch.name : (l.char||'？？？'), who: l.who, en: l.en || '', cn: l.cn || '' }; }
          if (l.type === 'me') return { me: l.cn || '', en: l.en || '' };
          return { cn: l.cn || '' };
        });
        const chapterNum = (c.chapterNum !== undefined && c.chapterNum !== null) ? c.chapterNum : parseChapterNum(c.title);
        SCENES[sceneId] = {
          bg: c.bg || 'city', loc: c.location || c.title, chapter: c.title, chapterNum,
          lines,
          onEnd: () => {
            globalData.completedChapters[c.key] = true;
            saveGlobal();
            toast('◈ 完成：' + c.title, 'ok');
            saveNow();
            setTimeout(() => {
              if (chapterNum !== null && chapterNum !== undefined) showChapterEndDialog(chapterNum, c.title);
              else { showScreen('map'); }
            }, 400);
          }
        };
      }
      return true;
    }
  }
  return false;
}

function continueGame(){
  const d = loadSaved();
  if (!d) { toast('没有可继续的进度', 'warn'); return; }
  state = newState(d.player?.name || '记者');
  state.uid = d.uid || state.uid;
  state.player = Object.assign(state.player, d.player || {});
  state.stats = Object.assign(state.stats, d.stats || {});
  state.affection = d.affection || {};
  state.flags = d.flags || {};
  state.readLines = d.readLines || {};
  state.log = d.log || [];
  state.sceneId = d.sceneId;
  state.lineIdx = typeof d.lineIdx === 'number' ? d.lineIdx : 0;
  state.branchKey = d.branchKey || 'main';
  state.branchIdx = d.branchIdx || 0;
  
  if (state.sceneId) {
    const ok = ensureSceneLoaded(state.sceneId);
    if (ok) {
      playSceneFromSnapshot();
      toast('◈ 已继续上次进度', 'ok');
      return;
    }
  }
  showScreen('map');
}

function bindEvents(){
  $$('#screen-title [data-act]').forEach(btn => {
    btn.onclick = () => {
      try { Sfx.ensure(); Sfx.click(); } catch(e){}
      const act = btn.dataset.act;
      if (act === 'new') startNewGame();
      else if (act === 'continue') continueGame();
      else if (act === 'toc') { if (!state) state = newState('记者'); showScreen('toc'); }
      else if (act === 'workshop') { if (!state) state = newState('记者'); showScreen('workshop'); }
      else if (act === 'archive') openArchiveModal();
      else if (act === 'about') openAbout();
    };
  });
  $$('.nav-btn').forEach(btn => {
    btn.onclick = () => {
      Sfx.click();
      if (!state) state = newState('记者');
      const nav = btn.dataset.nav;
      if (nav === 'game') {
        if (state.sceneId) {
          const ok = ensureSceneLoaded(state.sceneId);
          if (ok) { 
            playSceneFromSnapshot(); 
            return; 
          }
        }
        toast('还没有进行中的剧情，从地图进入地点开始吧'); 
        showScreen('map');
      } else showScreen(nav);
    };
  });
  document.addEventListener('click', (e) => {
    const tb = e.target.closest('[data-act]');
    if (!tb) return;
    const act = tb.dataset.act;
    if (act === 'map') { Sfx.click(); showScreen('map'); }
    else if (act === 'archive') { Sfx.click(); openArchiveModal(); }
    else if (act === 'toc') { Sfx.click(); showScreen('toc'); }
    else if (act === 'workshop') { Sfx.click(); showScreen('workshop'); }
    else if (act === 'home') { Sfx.click(); backToTitle(); }
  });
  const br = $('#btnRewind'); if (br) br.onclick = () => { Sfx.click(); rewindToLastChoice(); };
  const bh = $('#btnHistory'); if (bh) bh.onclick = () => { Sfx.click(); openStoryLog(); };
  const ba = $('#btnAuto'); if (ba) ba.onclick = () => {
    settings.autoPlay = !settings.autoPlay;
    ba.classList.toggle('active', settings.autoPlay);
    saveSettings();
    toast(settings.autoPlay ? '◈ 自动播放已开启' : '◈ 自动播放已关闭');
    if (settings.autoPlay && !typingState.active) autoTimer = setTimeout(advanceLine, 2000);
  };
  const bs = $('#btnSkip'); if (bs) bs.onclick = () => {
    const scene = SCENES[state?.sceneId]; if (!scene) return;
    if (scene.branches) { toast('分支剧情暂不支持跳过', 'warn'); return; }
    const lines = scene.lines || [];
    state.lineIdx = lines.length - 1;
    if (scene.choices && scene.choices.length) { pushSnapshot(); state.choiceMarkers.push(state.snapshots.length - 1); showChoices(scene.choices); }
    else if (scene.next) playScene(scene.next);
    else if (scene.onEnd) scene.onEnd();
  };
  const brn = $('#btnRename'); if (brn) brn.onclick = () => {
    Sfx.click();
    if (!state) return;
    openModal({
      title:'修 改 姓 名 / 昵 称',
      body:
        '<input class="inp" id="rnName" placeholder="姓名" value="' + esc(state.player.name) + '" maxlength="10" style="margin-bottom:10px;text-align:center;">' +
        '<input class="inp" id="rnNick" placeholder="昵称" value="' + esc(state.player.nick) + '" maxlength="10" style="text-align:center;">',
      footHTML:'<button class="btn ghost" onclick="(function(){var l=document.getElementById(\'modalLayer\');l.classList.remove(\'open\');l.innerHTML=\'\';})()">取消</button><button class="btn primary" id="rnOk">确认</button>',
      onMount: (w) => {
        w.querySelector('#rnOk').onclick = () => {
          state.player.name = (w.querySelector('#rnName').value || '记者').trim().slice(0,10) || '记者';
          state.player.nick = (w.querySelector('#rnNick').value || state.player.name).trim().slice(0,10) || state.player.name;
          saveNow(); closeModal(w); toast('◈ 已更新','ok');
        };
      }
    });
  };
  const be = $('#btnExport'); if (be) be.onclick = () => { Sfx.click(); exportSave(); };
  const bH = $('#btnHome'); if (bH) bH.onclick = () => { Sfx.click(); if (confirm('返回标题？当前进度已自动保存。')) { saveNow(); backToTitle(); } };
  const stage = $('#stage');
  if (stage) stage.addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    if ($('#choices')?.classList.contains('active')) return;
    if (!state || state.screen !== 'game') return;
    advanceLine();
  });
  document.addEventListener('keydown', (e) => {
    if (modalStack.length) { if (e.key === 'Escape') closeModal(); return; }
    if (state?.screen === 'game') {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!$('#choices')?.classList.contains('active')) advanceLine(); }
    }
  });
}

function openStoryLog(){
  const html = (state?.log || []).slice().reverse().map(l => {
    if (l.type === 'choice') return '<div style="color:var(--gold);font-size:12.5px;padding:8px 12px;border-left:2px solid var(--line-s);background:rgba(201,169,97,.05);margin-bottom:10px;">▸ ' + esc(l.text||l.cn||'') + '</div>';
    const en = l.en ? '<div style="font-family:var(--f-en);font-style:italic;font-size:12px;color:var(--gold-b);margin-bottom:2px;">' + esc(l.en) + '</div>' : '';
    const sp = l.speaker ? '<div style="font-family:var(--f-deco);font-size:10.5px;color:var(--gold-b);letter-spacing:.14em;margin-bottom:3px;">' + esc(l.speaker) + '</div>' : '';
    return '<div style="margin-bottom:12px;">' + sp + en + '<div style="font-size:13px;color:var(--text);line-height:1.75;">' + esc(l.cn||'') + '</div></div>';
  }).join('') || '<div class="empty">还没有记录。</div>';
  openModal({
    title:'对 话 记 录', body: html,
    footHTML:'<button class="btn primary" onclick="(function(){var l=document.getElementById(\'modalLayer\');l.classList.remove(\'open\');l.innerHTML=\'\';})()">关闭</button>'
  });
}

window.NF = {
  state: () => state,
  settings: () => settings,
  userContent: () => userContent,
  saveUser, saveNow, saveSettings, applySettings,
  openModal, closeModal, closeAllModals, toast, Sfx, showScreen, backToTitle,
  playScene, playUserChapter, showLevelUp, getLevel, LEVELS,
  CHARS, SYMBOLS, LOCATIONS, CODEX, BOND_TOPICS_BUILTIN, GIFTS_BUILTIN, CGS_BUILTIN, SCENES,
  getAllLocations, isLocationUnlocked, getLocationIcon,
  getAllBondTopics, getAllGifts, getAllCGs,
  renderMap, renderBondGrid, renderTOC, renderLog, renderSettings, openArchiveModal,
  startNewGame, continueGame,
  parseChapterNum, getChapterList, findNextChapterByNum, showChapterEndDialog
};

(function init(){
  try {
    const title = document.getElementById('screen-title');
    if (title) { title.classList.add('active'); title.style.opacity = '1'; }
    loadSettings(); loadGlobal(); loadUser();
    bindEvents(); updateNav('game');
    console.log('%c入魇 · Nightfalling', 'color:#c9a961;font-size:18px;letter-spacing:6px;');
    console.log('%c「能看见日落的人，是幸福的。」', 'color:#8a8070;font-size:11px;font-style:italic;');
    console.log('%cv1.0.0 · GSAP=' + (HAS_GSAP() ? 'loaded' : 'fallback') + ' · 符号 ' + Object.keys(window.SYMBOLS).reduce((s,k)=>s+window.SYMBOLS[k].length,0) + ' 个', 'color:#7a6636;font-size:10px;');
    const initAudio = () => { try { Sfx.ensure(); } catch(e){}; document.removeEventListener('touchstart', initAudio); document.removeEventListener('click', initAudio); };
    document.addEventListener('touchstart', initAudio, { once: true });
    document.addEventListener('click', initAudio, { once: true });
  } catch(e) { console.error('init error', e); }
})();
