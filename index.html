      </div>

      <div style="display:flex;gap:10px;">
        <button class="btn" id="drRoll" style="flex:1;">掷 骰</button>
        <button class="btn" id="drAttack" style="flex:1;" disabled>攻 击</button>
        <button class="btn" id="drDefend" style="flex:1;" disabled>防 御</button>
      </div>
      <div style="text-align:center;margin-top:14px;font-size:11px;color:var(--text-d);" id="drLog">—</div>
    `,
    footHTML: `<button class="btn ghost" id="drFlee">逃 离 梦 域</button>`,
    onMount: (wrap) => {
      const diceEl = wrap.querySelector('#drDice');
      const msgEl = wrap.querySelector('#drDiceMsg');
      const logEl = wrap.querySelector('#drLog');
      const rollBtn = wrap.querySelector('#drRoll');
      const atkBtn = wrap.querySelector('#drAttack');
      const defBtn = wrap.querySelector('#drDefend');
      const phpEl = wrap.querySelector('#bPhp');
      const psanEl = wrap.querySelector('#bPsan');
      const ehpEl = wrap.querySelector('#bEhp');
      const phpBar = wrap.querySelector('#bPhpBar');
      const psanBar = wrap.querySelector('#bPsanBar');
      const ehpBar = wrap.querySelector('#bEhpBar');

      let lastRoll = 0;

      function updateBars() {
        phpEl.textContent = Math.max(0, battle.playerHp);
        psanEl.textContent = Math.max(0, battle.playerSan);
        ehpEl.textContent = Math.max(0, battle.enemyHp);
        phpBar.style.width = clamp(battle.playerHp, 0, 100) + '%';
        psanBar.style.width = clamp(battle.playerSan, 0, 100) + '%';
        ehpBar.style.width = clamp(battle.enemyHp, 0, 100) + '%';
      }

      function rollDice() {
        if (battle.over) return;
        if (battle.diceRolled) { msgEl.textContent = '本回合已经掷过骰了。'; return; }
        Sfx.dice();
        rollBtn.disabled = true;
        let count = 0;
        const interval = setInterval(() => {
          diceEl.textContent = Math.floor(Math.random() * 20) + 1;
          count++;
          if (count >= 10) {
            clearInterval(interval);
            lastRoll = Math.floor(Math.random() * 20) + 1;
            diceEl.textContent = lastRoll;
            if (settings.animations) {
              gsap.fromTo(diceEl, { scale: 0.8, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.5, ease: 'elastic.out(1, 0.5)' });
            }
            if (lastRoll > 10) {
              Sfx.success();
              msgEl.textContent = '◈ 判定成功（' + lastRoll + ' > 10）';
              msgEl.style.color = '#9dd0a0';
            } else {
              Sfx.fail();
              msgEl.textContent = '✕ 判定失败（' + lastRoll + ' ≤ 10）· 理智 -10';
              msgEl.style.color = '#d08a9c';
              battle.playerSan -= 10;
              updateBars();
              if (settings.shake) vibrate(100);
            }
            battle.diceRolled = true;
            atkBtn.disabled = false;
            defBtn.disabled = false;
            if (battle.playerSan <= 0) endBattle('lose');
          }
        }, 80);
      }

      function doAction(type) {
        if (battle.over || !battle.diceRolled) return;
        atkBtn.disabled = true;
        defBtn.disabled = true;

        if (type === 'attack') {
          Sfx.hit();
          if (settings.shake) vibrate(60);
          let dmg = lastRoll * 2 + Math.floor(Math.random() * 10);
          if (lastRoll > 15) dmg += 15;
          battle.enemyHp -= dmg;
          logEl.textContent = '你造成 ' + dmg + ' 点伤害。';
        } else {
          battle.playerSan = Math.min(100, battle.playerSan + 8);
          logEl.textContent = '你稳住了心神。理智 +8。';
          Sfx.tone(523, 0.15, 'sine', 0.12);
        }

        updateBars();

        if (battle.enemyHp <= 0) {
          setTimeout(() => endBattle('win'), 500);
          return;
        }

        // 敌方反击
        setTimeout(() => {
          const dmg = 8 + Math.floor(Math.random() * 12);
          battle.playerSan -= dmg;
          battle.playerHp -= Math.floor(dmg / 2);
          logEl.textContent += ' 残影反击，理智 -' + dmg + '。';
          Sfx.hit();
          if (settings.shake) vibrate(80);
          updateBars();

          if (battle.playerSan <= 0 || battle.playerHp <= 0) {
            setTimeout(() => endBattle('lose'), 400);
            return;
          }

          battle.diceRolled = false;
          rollBtn.disabled = false;
          msgEl.textContent = '新回合。再次掷骰。';
          msgEl.style.color = '';
        }, 900);
      }

      function endBattle(result) {
        battle.over = true;
        rollBtn.disabled = true;
        atkBtn.disabled = true;
        defBtn.disabled = true;
        if (result === 'win') {
          Sfx.success();
          const silver = 30 + Math.floor(Math.random() * 20);
          state.stats.silver += silver;
          state.flags.dreamWin = (state.flags.dreamWin || 0) + 1;
          saveGame();
          setTimeout(() => {
            closeModal(wrap);
            openModal({
              title: '梦 域 · 胜 利',
              body: `<div class="ending-card">
                <span class="e-icon">✦</span>
                <div class="e-title">残 影 消 散</div>
                <div class="e-sub">Dream Shard Collected</div>
                <div class="e-desc">焦土残影在你面前化为灰烬。<br>
                  灰烬中落下一枚梦域碎片，你把它收进袋里。<br><br>
                  获得 <b style="color:var(--gold);">${silver} 银镑</b>。</div>
              </div>`,
              footHTML: `<button class="btn primary" id="drBack">返回地图</button>`,
              onMount: (w) => {
                w.querySelector('#drBack').onclick = () => { closeModal(w); showScreen('map'); };
              }
            });
          }, 500);
        } else {
          Sfx.fail();
          setTimeout(() => {
            closeModal(wrap);
            openModal({
              title: '梦 域 · 沦 陷',
              body: `<div class="ending-card">
                <span class="e-icon" style="color:#c04060;">☠</span>
                <div class="e-title" style="color:#c04060;">未 归 之 人</div>
                <div class="e-sub">The Unreturned</div>
                <div class="e-desc">你的意识正在沉入梦域的底部。<br>
                  在最后一刻，你被一只黑鸦拖了回来。<br><br>
                  （你失败了。但至少，你还活着。）</div>
              </div>`,
              footHTML: `<button class="btn primary" id="drBack">返回地图</button>`,
              onMount: (w) => {
                w.querySelector('#drBack').onclick = () => { closeModal(w); showScreen('map'); };
              }
            });
          }, 500);
        }
      }

      rollBtn.onclick = rollDice;
      atkBtn.onclick = () => doAction('attack');
      defBtn.onclick = () => doAction('defend');
      wrap.querySelector('#drFlee').onclick = () => {
        if (battle.over || confirm('确定要逃离梦域？')) {
          Sfx.click();
          closeModal(wrap);
          showScreen('map');
        }
      };
      updateBars();
    }
  });
}

/* ============================================================
   记录页
   ============================================================ */
let logTab = 'char';

function renderLog() {
  const tabs = [
    { id: 'char', label: '人物' },
    { id: 'story', label: '剧情' },
    { id: 'intel', label: '情报' },
    { id: 'endings', label: '结局' }
  ];
  const tabsEl = $('#logTabs');
  tabsEl.innerHTML = tabs.map(t =>
    `<button class="log-tab ${t.id === logTab ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');
  tabsEl.querySelectorAll('.log-tab').forEach(btn => {
    btn.onclick = () => {
      Sfx.click();
      logTab = btn.dataset.tab;
      renderLog();
    };
  });

  const body = $('#logBody');
  if (logTab === 'char') {
    let html = '<div class="char-grid">';
    Object.keys(CHARS).forEach(id => {
      if (id === 'narrator' || id === 'me') return;
      if (!state.flags['met_' + id] && !state.affection[id] && id !== 'fiman' && id !== 'kash') return;
      const c = CHARS[id];
      const aff = state.affection[id] || 0;
      html += `<div class="char-card">
        <div class="char-head">
          <div class="char-avatar">${c.sym}</div>
          <div>
            <div class="char-name">${esc(c.name)}</div>
            <div class="char-en">${esc(c.en)}</div>
            <div class="char-title">${esc(c.title || '')}</div>
          </div>
        </div>
        <div class="char-aff">亲密 <div class="aff-bar"><div class="aff-fill" style="width:${clamp(aff,0,100)}%"></div></div> ${aff}</div>
        <div class="char-desc">${esc(c.desc)}</div>
      </div>`;
    });
    html += '</div>';
    body.innerHTML = html;
    $('#logSub').textContent = '已结识 ' + Object.keys(state.affection).length + ' 人';
  } else if (logTab === 'story') {
    if (!state.log || !state.log.length) {
      body.innerHTML = '<div class="empty">还没有任何记录。<br>故事从你踏进落日之都的那一刻开始。</div>';
      $('#logSub').textContent = '——';
      return;
    }
    body.innerHTML = state.log.slice().reverse().map(l => {
      if (l.type === 'choice') return `<div class="log-entry choice"><div class="le-cn">▸ ${esc(l.text)}</div></div>`;
      const en = l.en ? `<div class="le-en">${esc(l.en)}</div>` : '';
      return `<div class="log-entry">
        <span class="le-speaker">${esc(l.speaker || '')}</span>
        ${en}
        <div class="le-cn">${esc(l.cn || l.text || '')}</div>
      </div>`;
    }).join('');
    $('#logSub').textContent = state.log.length + ' 条记录';
  } else if (logTab === 'intel') {
    const intels = [
      { name: '封印并不完全稳固', desc: '封印战场遗址的乌鸦烙印纹路清晰得像昨天才烙上去的。伸手去碰，指尖会感到一阵冰凉——像是碰到了什么还活着的东西。', done: state.flags.archiveDone || state.flags.chessDone },
      { name: '摩耳甫斯在等待时机', desc: '档案卷宗上只写了一行字：「他还会醒。」封印是暂时的。摩耳甫斯在梦域深处，他只是在等——等有人把他放出来。', done: state.flags.archiveDone },
      { name: '缇斯是莫维奥娅的哥哥', desc: '被梦魇选中的容器，是副院长的亲哥哥。莫维奥娅不愿提起这个名字。', done: state.flags.kashSecret || state.flags.archiveDone },
      { name: '梦域正在扩张', desc: '西边的梦域又扩了。有个村子一夜之间所有人都没醒过来。管理院的人进去了，但据说进去的人也没全出来。', done: state.flags.dreamWin },
      { name: '能看见日落的人，是幸福的', desc: '菲曼的奶奶给酒馆起了这个名字。因为只要你还看得见日落，就说明你又撑过了一天。', done: state.affection.fiman >= 5 }
    ];
    body.innerHTML = intels.map(i => `
      <div class="char-card" style="margin-bottom:10px;">
        <div class="char-name" style="margin-bottom:6px;">${i.done ? '◈' : '◇'} ${esc(i.name)}</div>
        <div class="char-desc" style="margin-top:0;padding-top:0;border:none;color:${i.done ? 'var(--text)' : 'var(--text-d)'};">
          ${i.done ? esc(i.desc) : '尚未解锁。继续探索剧情与地点。'}
        </div>
      </div>
    `).join('');
    $('#logSub').textContent = intels.filter(i => i.done).length + ' / ' + intels.length;
  } else if (logTab === 'endings') {
    body.innerHTML = `
      <div class="empty">
        <div style="font-size:40px;color:var(--gold);opacity:.5;margin-bottom:14px;">✦</div>
        结局收集<br>
        <span style="color:var(--gold-b);font-size:16px;letter-spacing:.2em;">0 / 3</span>
        <div style="margin-top:14px;font-size:12px;">继续你的旅程，解锁不同的结局。</div>
      </div>
    `;
    $('#logSub').textContent = '结局';
  }
}

  main.querySelector('#setExport').onclick = () => { Sfx.click(); exportSave(); };
  main.querySelector('#setImport').onclick = () => { Sfx.click(); openImportModal(); };
  main.querySelector('#setReset').onclick = () => {
    Sfx.click();
    openModal({
      title: '重 置 游 戏',
      body: `<p style="font-size:13px;line-height:1.9;color:#d08a9c;">这将清空所有进度、好感度、银镑与已读记录。<br>此操作不可恢复。确定继续？</p>`,
      footHTML: `<button class="btn ghost" id="rsCancel">取消</button>
                 <button class="btn danger" id="rsConfirm">再次确认 · 清空</button>`,
      onMount: (w) => {
        w.querySelector('#rsCancel').onclick = () => { Sfx.click(); closeModal(w); };
        w.querySelector('#rsConfirm').onclick = () => {
          Sfx.fail();
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem('nightfalling_slots_v1');
          closeModal(w);
          toast('◈ 已重置所有进度', 'warn');
          setTimeout(() => { location.reload(); }, 900);
        };
      }
    });
  };
  main.querySelector('#setAbout').onclick = () => { Sfx.click(); openAbout(); };
  main.querySelector('#setTitle').onclick = () => {
    if (confirm('返回标题界面？当前进度将自动保存。')) {
      Sfx.click();
      saveGame();
      backToTitle();
    }
  };
}

/* ============================================================
   存档管理
   ============================================================ */
const SLOT_KEY = 'nightfalling_slots_v1';

function getSlots() {
  try {
    return JSON.parse(localStorage.getItem(SLOT_KEY) || '{}');
  } catch (e) { return {}; }
}
function setSlots(slots) {
  try { localStorage.setItem(SLOT_KEY, JSON.stringify(slots)); } catch (e) {}
}

function openSaveManager() {
  const slots = getSlots();
  let html = '';
  for (let i = 1; i <= 3; i++) {
    const s = slots[i];
    if (s) {
      const t = new Date(s.ts);
      const timeStr = `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
      html += `<div class="save-slot" data-slot="${i}">
        <div class="save-slot-info">
          <div class="save-slot-t">存档 ${i} · ${esc(s.loc || '未知地点')}</div>
          <div class="save-slot-m">${timeStr} · 银镑 ${s.silver || 0}</div>
        </div>
        <div class="save-slot-actions">
          <button class="mini-btn" data-a="load">读取</button>
          <button class="mini-btn" data-a="save">覆盖</button>
          <button class="mini-btn danger" data-a="del">删除</button>
        </div>
      </div>`;
    } else {
      html += `<div class="save-slot" data-slot="${i}">
        <div class="save-slot-info">
          <div class="save-slot-t">存档 ${i} · 空</div>
          <div class="save-slot-m">尚未保存</div>
        </div>
        <div class="save-slot-actions">
          <button class="mini-btn" data-a="save">保存</button>
        </div>
      </div>`;
    }
  }
  openModal({
    title: '存 档 管 理',
    body: html,
    footHTML: `<button class="btn ghost" id="svClose">关闭</button>`,
    onMount: (wrap) => {
      wrap.querySelector('#svClose').onclick = () => { Sfx.click(); closeModal(wrap); };
      wrap.querySelectorAll('.mini-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const slot = btn.closest('.save-slot').dataset.slot;
          const action = btn.dataset.a;
          if (action === 'save') {
            const slots2 = getSlots();
            slots2[slot] = {
              ts: Date.now(),
              loc: $('#locLabel').textContent,
              silver: state.stats.silver,
              data: JSON.parse(JSON.stringify({
                player: state.player, stats: state.stats,
                affection: state.affection, flags: state.flags,
                readLines: state.readLines, log: state.log,
                currentScene: state.currentScene, currentLineIdx: state.currentLineIdx,
                uid: state.uid
              }))
            };
            setSlots(slots2);
            Sfx.success();
            toast('◈ 已保存至存档 ' + slot, 'ok');
            closeModal(wrap);
            setTimeout(openSaveManager, 200);
          } else if (action === 'load') {
            const slots2 = getSlots();
            const s = slots2[slot];
            if (!s) return;
            Sfx.success();
            Object.assign(state, JSON.parse(JSON.stringify(s.data)));
            saveGame();
            closeModal(wrap);
            toast('◈ 已读取存档 ' + slot, 'ok');
            setTimeout(() => {
              if (state.currentScene && SCENES[state.currentScene]) {
                playScene(state.currentScene);
              } else {
                showScreen('map');
              }
            }, 300);
          } else if (action === 'del') {
            if (!confirm('确定删除此存档？')) return;
            const slots2 = getSlots();
            delete slots2[slot];
            setSlots(slots2);
            Sfx.click();
            closeModal(wrap);
            setTimeout(openSaveManager, 200);
          }
        };
      });
    }
  });
}

function exportSave() {
  const data = {
    meta: { game: 'nightfalling', version: 1, ts: Date.now() },
    state: {
      player: state.player, stats: state.stats,
      affection: state.affection, flags: state.flags,
      readLines: state.readLines, log: state.log,
      currentScene: state.currentScene, currentLineIdx: state.currentLineIdx,
      uid: state.uid
    },
    slots: getSlots()
  };
  const text = JSON.stringify(data, null, 2);
  openModal({
    title: '导 出 存 档',
    body: `<p style="font-size:12px;color:var(--text-d);margin-bottom:12px;letter-spacing:.08em;">复制下方文本保存。跨设备游玩时可在"导入存档"中粘贴。</p>
           <textarea class="inp" id="expTa" readonly style="height:200px;font-family:monospace;font-size:11px;line-height:1.5;resize:none;">${esc(text)}</textarea>`,
    footHTML: `<button class="btn ghost" id="expClose">关闭</button>
               <button class="btn primary" id="expCopy">复制全部</button>`,
    onMount: (wrap) => {
      wrap.querySelector('#expClose').onclick = () => { Sfx.click(); closeModal(wrap); };
      wrap.querySelector('#expCopy').onclick = () => {
        const ta = wrap.querySelector('#expTa');
        ta.select();
        try {
          document.execCommand('copy');
          Sfx.success();
          toast('◈ 已复制到剪贴板', 'ok');
        } catch (e) {
          toast('复制失败，请手动选择', 'warn');
        }
      };
    }
  });
}

function openImportModal() {
  openModal({
    title: '导 入 存 档',
    body: `<p style="font-size:12px;color:var(--text-d);margin-bottom:12px;letter-spacing:.08em;">粘贴之前导出的 JSON 文本。导入将覆盖当前进度。</p>
           <textarea class="inp" id="impTa" placeholder="在此粘贴 JSON 文本..." style="height:180px;font-family:monospace;font-size:11px;line-height:1.5;resize:none;"></textarea>`,
    footHTML: `<button class="btn ghost" id="impCancel">取消</button>
               <button class="btn primary" id="impOk">导入</button>`,
    onMount: (wrap) => {
      wrap.querySelector('#impCancel').onclick = () => { Sfx.click(); closeModal(wrap); };
      wrap.querySelector('#impOk').onclick = () => {
        const raw = wrap.querySelector('#impTa').value.trim();
        if (!raw) { toast('请输入 JSON 文本', 'warn'); return; }
        try {
          const d = JSON.parse(raw);
          if (d.state) {
            Object.assign(state, d.state);
            if (d.slots) setSlots(d.slots);
            saveGame();
            Sfx.success();
            toast('◈ 存档导入成功', 'ok');
            closeModal(wrap);
            setTimeout(() => {
              if (state.currentScene && SCENES[state.currentScene]) playScene(state.currentScene);
              else showScreen('map');
            }, 300);
          } else {
            toast('格式不正确：缺少 state', 'warn');
          }
        } catch (e) {
          Sfx.fail();
          toast('导入失败：JSON 解析错误', 'warn');
        }
      };
    }
  });
}

        <span style="color:var(--gold);">◆</span> 地图中的地点可触发剧情、小游戏或梦域副本。<br>

/* ============================================================
   返回标题
   ============================================================ */
function backToTitle() {
  closeAllModals();
  stopTyping();
  clearTimeout(autoPlayTimer);
  showScreen('title');
  $('#bottomNav').style.display = 'none';
}

/* ============================================================
   事件绑定
   ============================================================ */
function bindEvents() {
  // 标题页按钮
  $$('#screen-title [data-act]').forEach(btn => {
    btn.onclick = () => {
      Sfx.ensure();
      Sfx.click();
      const act = btn.dataset.act;
      if (act === 'new') {
        openModal({
          title: '新 的 旅 程',
          body: `
            <div style="text-align:center;margin-bottom:14px;">
              <div style="font-size:12px;color:var(--text-d);letter-spacing:.14em;margin-bottom:14px;">请为记者留下姓名与昵称</div>
              <input class="inp" id="newName" placeholder="姓名（默认：记者）" maxlength="10" style="margin-bottom:10px;">
              <input class="inp" id="newNick" placeholder="昵称（默认：记者）" maxlength="10">
              <div style="margin-top:12px;font-size:11px;color:var(--text-d);letter-spacing:.08em;">性别</div>
              <div class="seg" id="newGender" style="display:inline-flex;margin-top:8px;">
                <button data-v="女" class="active">女</button>
                <button data-v="男">男</button>
                <button data-v="不限">不限</button>
              </div>
            </div>
          `,
          footHTML: `<button class="btn ghost" id="newCancel">取消</button>
                     <button class="btn primary" id="newStart">启 程</button>`,
          onMount: (wrap) => {
            wrap.querySelector('#newCancel').onclick = () => { Sfx.click(); closeModal(wrap); };
            let gender = '女';
            wrap.querySelectorAll('#newGender button').forEach(b => {
              b.onclick = () => {
                gender = b.dataset.v;
                wrap.querySelectorAll('#newGender button').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
              };
            });
            wrap.querySelector('#newStart').onclick = () => {
              const name = (wrap.querySelector('#newName').value || '记者').trim().slice(0, 10) || '记者';
              const nick = (wrap.querySelector('#newNick').value || name).trim().slice(0, 10) || name;
              state.player = { name, nick, gender, personality: '冷静' };
              state.log = [];
              state.affection = {};
              state.flags = {};
              state.stats = { silver: 0, sanity: 100 };
              saveGame();
              Sfx.success();
              closeModal(wrap);
              setTimeout(() => playScene('prologue_1'), 300);
            };
          }
        });
      } else if (act === 'continue') {
        if (loadGame() && state.currentScene) {
          if (SCENES[state.currentScene]) {
            playScene(state.currentScene);
            toast('◈ 已继续上次进度', 'ok');
          } else {
            showScreen('map');
          }
        } else {
          toast('没有可继续的进度', 'warn');
        }
      } else if (act === 'archive') {
        openArchiveModal();
      } else if (act === 'about') {
        openAbout();
      }
    };
  });

  // 底部导航
  $$('.nav-btn').forEach(btn => {
    btn.onclick = () => {
      Sfx.click();
      const nav = btn.dataset.nav;
      if (nav === 'game') {
        if (state.currentScene && SCENES[state.currentScene]) {
          showScreen('game');
        } else {
          showScreen('map');
        }
      } else {
        showScreen(nav);
      }
    };
  });

  // 点击推进
  $('#stage').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    if ($('.choices').classList.contains('active')) return;
    if (state.screen !== 'game') return;
    advanceLine();
  });

  // 键盘
  document.addEventListener('keydown', (e) => {
    if (modalStack.length) {
      if (e.key === 'Escape') closeModal();
      return;
    }
    if (state.screen === 'game') {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (!$('.choices').classList.contains('active')) advanceLine();
      }
    }
  });
}

function openArchiveModal() {
  openModal({
    title: '档 案 馆',
    body: `
      <div style="text-align:center;padding:16px 0;">
        <div style="font-size:42px;color:var(--gold);opacity:.6;margin-bottom:16px;">❖</div>
        <div style="font-family:var(--f-deco);font-size:14px;letter-spacing:.2em;color:var(--gold-b);margin-bottom:10px;">永 久 档 案</div>
        <p style="font-size:12.5px;line-height:1.9;color:var(--text);">

    onMount: (wrap) => {
      wrap.querySelector('#arcOk').onclick = () => { Sfx.click(); closeModal(wrap); };
    }
  });
}

/* ============================================================
   初始化
   ============================================================ */
(function init() {
  loadSettings();
  bindEvents();

  // 初始显示标题页
  document.getElementById('screen-title').classList.add('active');
  $('#bottomNav').style.display = 'none';

  // 预加载用户设置
  updateNav('game');

  console.log('%c入魇 · Nightfalling', 'color:#c9a961;font-size:18px;font-family:Georgia;letter-spacing:6px;');
  console.log('%c「能看见日落的人，是幸福的。」', 'color:#8a8070;font-size:11px;font-style:italic;');
  console.log('%cv1.0.0 · 引擎就绪', 'color:#7a6636;font-size:10px;');

  // 首次用户交互时初始化音频
  const initAudio = () => {
    Sfx.ensure();
    document.removeEventListener('touchstart', initAudio);
    document.removeEventListener('click', initAudio);
  };
  document.addEventListener('touchstart', initAudio, { once: true });
  document.addEventListener('click', initAudio, { once: true });
})();
</script>
