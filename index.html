<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0810">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>入魇 · Nightfalling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --f-deco:"Cinzel Decorative","Noto Serif SC",serif;
  --f-en:"Cormorant Garamond",Georgia,serif;
  --f-cn:"Noto Serif SC","Songti SC","STSong",serif;
  --gold:#c9a961;--gold-b:#e8d5a0;--gold-d:#7a6636;
  --bg:#0a0810;--panel:#16121f;--panel2:#1c1428;
  --text:#ded5c4;--text-d:#8a8070;
  --accent:#8b2f4f;--purple:#4a2b5e;
  --line:rgba(201,169,97,.22);--line-s:rgba(201,169,97,.45);
  --glass:rgba(16,12,24,.72);
  --font-scale:1;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --nav-h:62px;
}
[data-theme="day"]{
  --gold:#8b6f2f;--gold-b:#5d4620;--gold-d:#a58a4e;
  --bg:#ece4d2;--panel:#faf5e9;--panel2:#f2ead7;
  --text:#2a2420;--text-d:#6a6050;
  --line:rgba(139,111,47,.25);--line-s:rgba(139,111,47,.5);
  --glass:rgba(250,245,233,.82);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-cn);-webkit-font-smoothing:antialiased;font-size:calc(15px * var(--font-scale));}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse at 12% 6%,rgba(90,50,120,.22),transparent 55%),
  radial-gradient(ellipse at 88% 94%,rgba(139,47,79,.18),transparent 55%),
  radial-gradient(ellipse at 50% 50%,rgba(20,14,32,.5),transparent 80%);
  pointer-events:none;z-index:0;}
[data-theme="day"] body::before{background:
  radial-gradient(ellipse at 12% 6%,rgba(180,150,90,.28),transparent 55%),
  radial-gradient(ellipse at 88% 94%,rgba(160,120,80,.22),transparent 55%),
  radial-gradient(ellipse at 50% 50%,rgba(255,245,220,.6),transparent 80%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.008) 2px,rgba(255,255,255,.008) 3px);}
[data-theme="day"] body::after{background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.012) 2px,rgba(0,0,0,.012) 3px);}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1;opacity:0;}
.screen.active{display:flex;opacity:1;}

/* ============ 通用装饰 ============ */
.frame{position:relative;border:1px solid var(--line);background:linear-gradient(165deg,var(--panel2),var(--panel));}
.frame::before,.frame::after{content:'❖';position:absolute;font-size:11px;color:var(--gold);opacity:.85;line-height:1;pointer-events:none;}
.frame::before{top:-6px;left:-6px;}
.frame::after{bottom:-6px;right:-6px;}
.divider{display:flex;align-items:center;gap:10px;color:var(--gold-d);font-size:11px;letter-spacing:.3em;margin:14px 0;}
.divider::before,.divider::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line-s),transparent);}
.divider span{white-space:nowrap;}

/* ============ 按钮 ============ */
.btn{background:transparent;border:1px solid var(--line-s);color:var(--text);
  font-family:var(--f-cn);font-size:calc(13px * var(--font-scale));letter-spacing:.18em;
  padding:12px 18px;cursor:pointer;transition:all .28s cubic-bezier(.16,1,.3,1);
  position:relative;overflow:hidden;}
.btn:hover,.btn:active{border-color:var(--gold);color:var(--gold-b);
  background:rgba(201,169,97,.1);box-shadow:0 0 20px rgba(201,169,97,.2);letter-spacing:.24em;}
.btn.primary{border-color:var(--gold);color:var(--gold-b);background:rgba(201,169,97,.08);}
.btn.primary:hover{background:rgba(201,169,97,.2);}
.btn.ghost{border-color:var(--line);color:var(--text-d);font-size:calc(12px * var(--font-scale));padding:9px 14px;}
.btn.danger{border-color:rgba(160,60,80,.6);color:#d08a9c;}
.btn.danger:hover{background:rgba(160,60,80,.15);border-color:#d08a9c;color:#ffb0c4;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

/* ============ 标题页 ============ */
#screen-title{align-items:center;justify-content:center;padding:24px;}
.title-card{position:relative;max-width:520px;width:100%;padding:44px 30px 34px;
  text-align:center;border:1px solid var(--line-s);
  background:linear-gradient(165deg,rgba(28,20,40,.85),rgba(12,8,18,.95));
  box-shadow:0 0 80px rgba(0,0,0,.9),inset 0 0 90px rgba(201,169,97,.04);
  max-height:92vh;overflow-y:auto;}
[data-theme="day"] .title-card{background:linear-gradient(165deg,rgba(255,250,240,.95),rgba(240,230,210,.95));box-shadow:0 0 60px rgba(120,100,60,.2);}
.title-card .corner{position:absolute;font-size:14px;color:var(--gold);opacity:.9;}
.title-card .corner.tl{top:6px;left:10px;}
.title-card .corner.tr{top:6px;right:10px;}
.title-card .corner.bl{bottom:6px;left:10px;}
.title-card .corner.br{bottom:6px;right:10px;}
.title-eyebrow{font-family:var(--f-deco);font-size:11px;letter-spacing:.4em;color:var(--gold-d);margin-bottom:18px;}
.title-main{font-family:var(--f-deco);font-size:clamp(38px,12vw,64px);letter-spacing:.12em;
  color:var(--gold-b);text-shadow:0 0 30px rgba(201,169,97,.55),0 0 70px rgba(139,47,79,.3);
  font-weight:900;line-height:1.1;margin-bottom:8px;}
.title-sub{font-family:var(--f-en);font-style:italic;font-size:14px;color:var(--gold-d);letter-spacing:.05em;margin-bottom:4px;}
.title-actions{display:flex;flex-direction:column;gap:10px;max-width:280px;margin:26px auto 0;}
.title-foot{margin-top:24px;font-size:11px;letter-spacing:.16em;color:var(--text-d);font-style:italic;}
.title-foot::before{content:'— ';color:var(--gold-d);}
.title-foot::after{content:' —';color:var(--gold-d);}

/* ============ 顶栏 ============ */
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(var(--safe-t) + 10px) 14px 10px;height:calc(52px + var(--safe-t));
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border-bottom:1px solid var(--line);position:relative;z-index:20;}
.topbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-s),transparent);}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0;}
.tb-mark{width:16px;height:16px;border:1px solid var(--gold);transform:rotate(45deg);position:relative;flex-shrink:0;}
.tb-mark::after{content:'';position:absolute;inset:3px;background:var(--gold);opacity:.65;}
.tb-title{font-family:var(--f-deco);font-size:13px;letter-spacing:.18em;color:var(--gold-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-loc{font-size:11px;letter-spacing:.14em;color:var(--text-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ============ 游戏主界面 ============ */
#screen-game{display:none;flex-direction:column;}
#screen-game.active{display:flex;}
.stage{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;
  padding-bottom:var(--nav-h);}
.scene-bg{position:absolute;inset:0;transition:background .8s;z-index:0;}
.bg-city{background:linear-gradient(180deg,#0e0a16 0%,#1a1224 40%,#2a1c30 100%);}
.bg-city::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 20% 80%,rgba(201,169,97,.18),transparent 40%),
             radial-gradient(circle at 80% 70%,rgba(201,169,97,.14),transparent 40%);}
.bg-tavern{background:linear-gradient(180deg,#1a1010 0%,#2a1810 50%,#1a0e08 100%);}
.bg-tavern::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 70% 30%,rgba(230,160,80,.25),transparent 50%),
             radial-gradient(circle at 20% 90%,rgba(160,80,40,.2),transparent 45%);}
.bg-grove{background:linear-gradient(180deg,#1a1408 0%,#2e2410 50%,#1e1808 100%);}
.bg-grove::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 30%,rgba(220,180,80,.22),transparent 60%);}
.bg-manor{background:linear-gradient(180deg,#0a0e18 0%,#141a28 50%,#0c1018 100%);}
.bg-manor::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(180,200,240,.18),transparent 50%);}
.bg-archive{background:linear-gradient(180deg,#100c08 0%,#1e160c 50%,#0e0a06 100%);}
.bg-archive::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 40% 40%,rgba(200,160,80,.15),transparent 55%);}
.bg-church{background:linear-gradient(180deg,#0c0818 0%,#1a1028 50%,#0a0614 100%);}
.bg-church::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 20%,rgba(120,80,200,.28),transparent 50%),
             radial-gradient(circle at 50% 80%,rgba(200,60,80,.18),transparent 55%);}
.bg-castle{background:linear-gradient(180deg,#060810 0%,#0e1420 50%,#080a14 100%);}
.bg-castle::before{content:'';position:absolute;inset:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.03) 0deg 90deg,transparent 90deg 180deg),
             radial-gradient(circle at 50% 50%,rgba(200,200,255,.15),transparent 60%);
  background-size:80px 80px,100% 100%;}
.bg-dream{background:linear-gradient(180deg,#0c0418 0%,#1e0a28 50%,#080210 100%);}
.bg-dream::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(120,60,180,.35),transparent 45%),
             radial-gradient(circle at 70% 70%,rgba(80,20,140,.3),transparent 50%),
             radial-gradient(circle at 50% 50%,rgba(200,80,200,.15),transparent 60%);
  animation:dreamPulse 8s ease-in-out infinite;}
@keyframes dreamPulse{0%,100%{opacity:.8;}50%{opacity:1;}}

.loc-bar{flex:0 0 auto;padding:8px 18px;font-size:11px;letter-spacing:.22em;color:var(--gold-d);
  background:linear-gradient(180deg,rgba(25,17,36,.75),rgba(15,10,22,.25));
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:relative;z-index:2;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.loc-bar::before{content:'◈';font-size:9px;color:var(--gold-d);}

.dialog-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 20px 16px;
  position:relative;z-index:2;scroll-behavior:smooth;}
.dialog-scroll::-webkit-scrollbar{width:4px;}
.dialog-scroll::-webkit-scrollbar-thumb{background:var(--line-s);}
.dialog-inner{max-width:760px;margin:0 auto;padding-bottom:20px;}

.line{margin-bottom:18px;animation:lineIn .45s cubic-bezier(.16,1,.3,1);}
@keyframes lineIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.line .speaker{font-family:var(--f-deco);font-size:11px;letter-spacing:.2em;color:var(--gold-b);
  margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.line .speaker::before{content:'';width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex-shrink:0;
  box-shadow:0 0 8px rgba(201,169,97,.7);}
.line .en{font-family:var(--f-en);font-style:italic;font-weight:600;
  font-size:calc(17px * var(--font-scale));line-height:1.55;color:var(--gold-b);
  letter-spacing:.01em;margin-bottom:7px;}
.line .cn{font-size:calc(14.5px * var(--font-scale));line-height:1.9;color:var(--text);
  letter-spacing:.01em;padding-left:14px;border-left:2px solid var(--line);word-break:break-word;}
.line.narration .cn{color:#a89e8e;font-style:italic;}
.line.monologue .cn{color:#b8a8c8;font-style:italic;}
[data-theme="day"] .line.narration .cn{color:#5a5040;}
[data-theme="day"] .line.monologue .cn{color:#5a4a6a;}

.cont-hint{position:absolute;right:26px;bottom:calc(var(--nav-h) + 22px);
  color:var(--gold);font-size:14px;opacity:.8;animation:bounce 1.6s infinite;
  pointer-events:none;z-index:5;}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.35;}50%{transform:translateY(6px);opacity:.9;}}

.choices{position:relative;z-index:3;padding:0 20px 12px;max-height:44vh;overflow-y:auto;display:none;}
.choices.active{display:block;animation:choiceIn .5s cubic-bezier(.16,1,.3,1);}
@keyframes choiceIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.choices-inner{max-width:760px;margin:0 auto;}
.choice-head{font-size:10.5px;letter-spacing:.4em;color:var(--gold-d);margin-bottom:11px;
  display:flex;align-items:center;gap:10px;}
.choice-head::before,.choice-head::after{content:'';height:1px;flex:1;
  background:linear-gradient(90deg,transparent,var(--line-s),transparent);}
.choice-btn{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:linear-gradient(90deg,rgba(201,169,97,.06),transparent);
  border:1px solid var(--line-s);color:var(--text);
  font-family:var(--f-cn);font-size:calc(14px * var(--font-scale));line-height:1.65;
  padding:12px 16px;margin-bottom:9px;cursor:pointer;
  transition:all .3s cubic-bezier(.16,1,.3,1);position:relative;}
.choice-btn::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--gold);transform:scaleY(0);transition:transform .3s;}
.choice-btn:hover,.choice-btn:active{background:linear-gradient(90deg,rgba(201,169,97,.18),transparent);
  border-color:var(--gold);transform:translateX(5px);
  box-shadow:0 0 22px rgba(201,169,97,.16);color:var(--gold-b);}
.choice-btn:hover::after{transform:scaleY(1);}
.choice-idx{color:var(--gold);font-size:13px;flex-shrink:0;margin-top:1px;
  text-shadow:0 0 8px rgba(201,169,97,.6);}
.choice-btn.danger{border-color:rgba(160,60,80,.5);}
.choice-btn.danger .choice-idx{color:#d08a9c;}

/* ============ 底部导航 ============ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:90;
  display:flex;align-items:center;justify-content:space-around;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:linear-gradient(0deg,var(--panel),var(--panel2));
  border-top:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.bottom-nav::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-s),transparent);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--text-d);font-family:var(--f-cn);
  cursor:pointer;padding:8px 4px;transition:all .25s;position:relative;}
.nav-btn .nav-ico{font-size:18px;line-height:1;transition:all .25s;}
.nav-btn .nav-lbl{font-size:10px;letter-spacing:.16em;}
.nav-btn.active{color:var(--gold-b);}
.nav-btn.active .nav-ico{transform:translateY(-2px);text-shadow:0 0 14px rgba(201,169,97,.75);}
.nav-btn.active::after{content:'';position:absolute;bottom:calc(var(--safe-b) + 3px);left:50%;transform:translateX(-50%);
  width:18px;height:2px;background:var(--gold);box-shadow:0 0 8px rgba(201,169,97,.8);}

/* ============ 地图 ============ */
#screen-map{display:none;flex-direction:column;}
#screen-map.active{display:flex;}
.map-main{flex:1;overflow-y:auto;padding:18px 16px calc(var(--nav-h) + var(--safe-b) + 16px);}
.map-region{margin-bottom:24px;}
.map-region-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;
  font-family:var(--f-deco);font-size:13px;letter-spacing:.22em;color:var(--gold-b);}
.map-region-head::before{content:'◆';color:var(--gold);font-size:10px;}
.map-region-head::after{content:'';flex:1;height:1px;
  background:linear-gradient(90deg,var(--line-s),transparent);}
.map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.map-card{position:relative;padding:16px 14px;cursor:pointer;
  border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));
  transition:all .3s cubic-bezier(.16,1,.3,1);overflow:hidden;}
.map-card::before{content:'❖';position:absolute;top:4px;right:6px;font-size:10px;color:var(--gold);opacity:.55;}
.map-card:hover,.map-card:active{border-color:var(--gold);transform:translateY(-2px);
  box-shadow:0 6px 22px rgba(0,0,0,.4),0 0 18px rgba(201,169,97,.15);}
.map-card.locked{opacity:.42;cursor:not-allowed;}
.map-card.locked:hover{transform:none;border-color:var(--line);box-shadow:none;}
.map-card-ico{font-size:22px;color:var(--gold);margin-bottom:8px;line-height:1;
  text-shadow:0 0 12px rgba(201,169,97,.5);}
.map-card-name{font-family:var(--f-deco);font-size:13px;letter-spacing:.12em;color:var(--gold-b);margin-bottom:4px;}
.map-card-desc{font-size:11px;color:var(--text-d);line-height:1.6;letter-spacing:.02em;}
.map-card-tag{display:inline-block;margin-top:8px;font-size:9.5px;letter-spacing:.2em;
  color:var(--gold-d);border:1px solid var(--line);padding:2px 7px;}
.map-card-tag.hot{border-color:rgba(160,60,80,.6);color:#d08a9c;}

/* ============ 记录 ============ */
#screen-log{display:none;flex-direction:column;}
#screen-log.active{display:flex;}
.log-main{flex:1;overflow:hidden;display:flex;flex-direction:column;
  padding-bottom:calc(var(--nav-h) + var(--safe-b));}
.log-tabs{flex:0 0 auto;display:flex;overflow-x:auto;gap:0;
  border-bottom:1px solid var(--line);padding:0 10px;background:var(--panel);}
.log-tabs::-webkit-scrollbar{display:none;}
.log-tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-d);
  font-family:var(--f-cn);font-size:12.5px;letter-spacing:.16em;padding:13px 14px;
  cursor:pointer;transition:all .25s;white-space:nowrap;margin-bottom:-1px;}
.log-tab.active{color:var(--gold-b);border-bottom-color:var(--gold);}
.log-body{flex:1;overflow-y:auto;padding:16px;}
.log-body::-webkit-scrollbar{width:4px;}
.log-body::-webkit-scrollbar-thumb{background:var(--line-s);}

.char-grid{display:grid;gap:10px;}
.char-card{position:relative;padding:14px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--panel2),var(--panel));cursor:pointer;
  transition:all .3s;}
.char-card:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(201,169,97,.15);}
.char-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.char-avatar{width:44px;height:44px;border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  color:var(--gold);background:rgba(201,169,97,.05);flex-shrink:0;position:relative;}
.char-avatar::before{content:'';position:absolute;inset:3px;border:1px solid var(--line);}
.char-name{font-family:var(--f-deco);font-size:14px;letter-spacing:.1em;color:var(--gold-b);}
.char-en{font-family:var(--f-en);font-style:italic;font-size:12px;color:var(--text-d);}
.char-title{font-size:11px;color:var(--text-d);letter-spacing:.1em;margin-top:2px;}
.char-aff{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10.5px;color:var(--gold-d);letter-spacing:.1em;}
.aff-bar{flex:1;height:4px;background:rgba(201,169,97,.12);position:relative;overflow:hidden;}
.aff-fill{height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold));transition:width .5s;}
.char-desc{font-size:12.5px;line-height:1.85;color:var(--text);margin-top:10px;padding-top:10px;
  border-top:1px solid var(--line);}

.log-entry{margin-bottom:14px;font-size:13px;line-height:1.85;}
.log-entry .le-speaker{font-family:var(--f-deco);font-size:11px;letter-spacing:.14em;color:var(--gold-b);
  display:block;margin-bottom:4px;}
.log-entry .le-cn{color:var(--text);}
.log-entry .le-en{font-family:var(--f-en);font-style:italic;color:var(--gold-b);font-size:13px;margin-bottom:3px;}
.log-entry.narr .le-cn{color:#a89e8e;font-style:italic;}
.log-entry.choice .le-cn{color:var(--gold);padding-left:10px;border-left:2px solid var(--line-s);}

/* ============ 设置 ============ */
#screen-settings{display:none;flex-direction:column;}
#screen-settings.active{display:flex;}
.set-main{flex:1;overflow-y:auto;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 16px);}
.set-main::-webkit-scrollbar{width:4px;}
.set-main::-webkit-scrollbar-thumb{background:var(--line-s);}
.set-group{margin-bottom:22px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--panel2),var(--panel));}
.set-group-head{padding:12px 16px;border-bottom:1px solid var(--line);
  font-family:var(--f-deco);font-size:12px;letter-spacing:.22em;color:var(--gold-b);
  display:flex;align-items:center;gap:8px;}
.set-group-head::before{content:'◈';font-size:10px;color:var(--gold);}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line);}
.set-row:last-child{border-bottom:none;}
.set-label{flex:1;min-width:0;}
.set-label-t{font-size:13px;color:var(--text);letter-spacing:.04em;}
.set-label-d{font-size:10.5px;color:var(--text-d);margin-top:3px;letter-spacing:.02em;line-height:1.5;}
.set-ctrl{flex-shrink:0;display:flex;align-items:center;gap:6px;}
.set-input{background:rgba(0,0,0,.25);border:1px solid var(--line-s);color:var(--gold-b);
  font-family:var(--f-cn);font-size:13px;padding:7px 11px;letter-spacing:.06em;
  outline:none;min-width:110px;text-align:center;transition:all .25s;}
[data-theme="day"] .set-input{background:rgba(255,255,255,.6);}
.set-input:focus{border-color:var(--gold);box-shadow:0 0 14px rgba(201,169,97,.25);}
.seg{display:flex;border:1px solid var(--line-s);overflow:hidden;}
.seg button{background:transparent;border:none;color:var(--text-d);
  font-family:var(--f-cn);font-size:11px;letter-spacing:.1em;padding:7px 10px;
  cursor:pointer;transition:all .25s;border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.active{background:rgba(201,169,97,.18);color:var(--gold-b);}
.seg button:hover:not(.active){color:var(--gold);}
.switch{position:relative;width:44px;height:24px;border:1px solid var(--line-s);
  cursor:pointer;transition:all .3s;background:rgba(0,0,0,.2);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;
  background:var(--text-d);transition:all .3s;border-radius:50%;}
.switch.on{border-color:var(--gold);background:rgba(201,169,97,.15);}
.switch.on::after{left:22px;background:var(--gold);box-shadow:0 0 10px rgba(201,169,97,.7);}
.slider{width:120px;-webkit-appearance:none;appearance:none;height:3px;
  background:rgba(201,169,97,.2);outline:none;border-radius:2px;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  background:var(--gold);border-radius:50%;cursor:pointer;
  box-shadow:0 0 10px rgba(201,169,97,.7);}
.slider::-moz-range-thumb{width:16px;height:16px;background:var(--gold);
  border-radius:50%;cursor:pointer;border:none;}
.save-slot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border:1px solid var(--line);margin-bottom:8px;
  background:rgba(201,169,97,.02);transition:all .25s;cursor:pointer;}
.save-slot:hover{border-color:var(--gold);background:rgba(201,169,97,.06);}
.save-slot-info{flex:1;min-width:0;}
.save-slot-t{font-size:13px;color:var(--gold-b);letter-spacing:.08em;margin-bottom:3px;}
.save-slot-m{font-size:10.5px;color:var(--text-d);letter-spacing:.02em;}
.save-slot-actions{display:flex;gap:6px;flex-shrink:0;}
.mini-btn{background:none;border:1px solid var(--line-s);color:var(--text-d);
  font-family:var(--f-cn);font-size:10.5px;padding:5px 9px;cursor:pointer;transition:all .25s;}
.mini-btn:hover{border-color:var(--gold);color:var(--gold-b);}
.mini-btn.danger{border-color:rgba(160,60,80,.5);color:#c07a92;}
.mini-btn.danger:hover{background:rgba(160,60,80,.15);border-color:#d08a9c;}

/* ============ 弹窗 ============ */
.modal-layer{position:fixed;inset:0;z-index:1000;display:none;align-items:center;
  justify-content:center;padding:18px;background:rgba(4,2,7,.85);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
[data-theme="day"] .modal-layer{background:rgba(60,50,30,.55);}
.modal-layer.open{display:flex;animation:fadeIn .25s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{position:relative;width:100%;max-width:560px;max-height:88vh;
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line-s);display:flex;flex-direction:column;
  box-shadow:0 0 70px rgba(0,0,0,.9),inset 0 0 70px rgba(201,169,97,.03);
  animation:modalIn .4s cubic-bezier(.16,1,.3,1);}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(16px);}to{opacity:1;transform:none;}}
.modal::before,.modal::after{content:'❖';position:absolute;font-size:12px;color:var(--gold);opacity:.9;}
.modal::before{top:-7px;left:-7px;}
.modal::after{bottom:-7px;right:-7px;}
.modal-head{flex:0 0 auto;padding:16px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;}
.modal-title{font-family:var(--f-deco);font-size:14px;letter-spacing:.24em;color:var(--gold-b);}
.modal-close{background:none;border:1px solid var(--line-s);color:var(--text-d);
  width:32px;height:32px;font-size:18px;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0;}
.modal-close:hover{color:var(--gold-b);border-color:var(--gold);background:rgba(201,169,97,.1);}
.modal-body{flex:1;overflow-y:auto;padding:18px 20px;}
.modal-body::-webkit-scrollbar{width:4px;}
.modal-body::-webkit-scrollbar-thumb{background:var(--line-s);}
.modal-foot{flex:0 0 auto;padding:14px 20px;border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

/* ============ Toast ============ */
.toast-layer{position:fixed;top:calc(var(--safe-t) + 64px);left:50%;transform:translateX(-50%);
  z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:92%;max-width:440px;}
.toast{background:linear-gradient(90deg,rgba(28,20,40,.96),rgba(20,14,30,.96));
  border:1px solid var(--line-s);color:var(--gold-b);font-size:12px;
  letter-spacing:.1em;padding:10px 18px;box-shadow:0 0 26px rgba(0,0,0,.7);
  animation:toastIn .4s cubic-bezier(.16,1,.3,1);text-align:center;
  line-height:1.6;max-width:100%;}
[data-theme="day"] .toast{background:linear-gradient(90deg,rgba(255,250,240,.98),rgba(245,235,215,.98));}
.toast.ok{border-color:rgba(120,180,120,.6);color:#9dd0a0;}
.toast.warn{border-color:rgba(160,60,80,.7);color:#d08a9c;}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:none;}}
.toast.out{animation:toastOut .35s forwards;}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px);}}

/* ============ 小游戏通用 ============ */
.mini-wrap{padding:6px 0;}
.mini-title{text-align:center;font-family:var(--f-deco);font-size:15px;letter-spacing:.2em;
  color:var(--gold-b);margin-bottom:6px;}
.mini-sub{text-align:center;font-size:11px;color:var(--text-d);letter-spacing:.1em;margin-bottom:16px;}
.mini-hud{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;
  padding:9px 14px;border:1px solid var(--line);background:rgba(201,169,97,.04);}
.mini-hud-item{font-size:11px;color:var(--text-d);letter-spacing:.08em;text-align:center;flex:1;}
.mini-hud-item b{display:block;font-family:var(--f-deco);font-size:15px;color:var(--gold-b);margin-top:2px;letter-spacing:.06em;}
.mini-stage{position:relative;border:1px solid var(--line-s);background:rgba(0,0,0,.3);
  min-height:280px;overflow:hidden;}
[data-theme="day"] .mini-stage{background:rgba(255,255,255,.35);}

/* 证据链 */
.evidence-area{position:relative;height:340px;touch-action:none;}
.ev-card{position:absolute;width:88px;padding:7px 6px;border:1px solid var(--line-s);
  background:linear-gradient(160deg,var(--panel2),var(--panel));cursor:pointer;
  font-size:10.5px;line-height:1.35;text-align:center;color:var(--text);
  transition:box-shadow .25s,border-color .25s;user-select:none;z-index:2;}
.ev-card .ev-ico{font-size:18px;display:block;margin-bottom:4px;color:var(--gold);}
.ev-card.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(201,169,97,.6);z-index:5;}
.ev-card.done{border-color:rgba(120,180,120,.7);background:rgba(120,180,120,.08);pointer-events:none;opacity:.7;}
.ev-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}

/* QTE 倒酒 */
.pour-stage{position:relative;height:280px;display:flex;align-items:flex-end;justify-content:center;gap:30px;padding-bottom:10px;}
.glass{position:relative;width:90px;height:220px;border:1px solid var(--line-s);
  border-top:none;background:rgba(0,0,0,.4);overflow:hidden;
  clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);}
.glass-liquid{position:absolute;bottom:0;left:0;right:0;height:0;
  background:linear-gradient(180deg,rgba(220,160,60,.85),rgba(160,90,30,.95));
  transition:height .04s linear;}
.glass-marker{position:absolute;left:-4px;right:-4px;height:2px;background:var(--gold);
  box-shadow:0 0 8px rgba(201,169,97,.9);z-index:3;}
.glass-marker .mlabel{position:absolute;right:calc(100% + 4px);top:-7px;font-size:9.5px;
  color:var(--gold-b);letter-spacing:.1em;white-space:nowrap;}
.glass-marker.m1{background:#e8d5a0;}
.glass-marker.m2{background:#d08a9c;box-shadow:0 0 8px rgba(208,138,156,.9);}
.pour-btn{width:100%;padding:16px;border:1px solid var(--gold);background:rgba(201,169,97,.12);
  color:var(--gold-b);font-family:var(--f-cn);font-size:15px;letter-spacing:.3em;
  cursor:pointer;user-select:none;transition:all .2s;touch-action:none;}
.pour-btn:active,.pour-btn.pouring{background:rgba(201,169,97,.3);letter-spacing:.36em;}
.pour-feedback{text-align:center;margin-top:12px;font-size:12px;letter-spacing:.1em;min-height:18px;}

/* 棋局 */
.chess-board{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;
  max-width:340px;margin:0 auto;aspect-ratio:1;padding:8px;
  border:1px solid var(--line-s);background:rgba(0,0,0,.3);}
[data-theme="day"] .chess-board{background:rgba(80,60,30,.12);}
.chess-cell{position:relative;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-size:22px;cursor:pointer;
  transition:all .25s;background:rgba(255,255,255,.02);}
.chess-cell.light{background:rgba(255,255,255,.07);}
.chess-cell.dark{background:rgba(0,0,0,.25);}
.chess-cell.death{background:rgba(160,60,80,.35);border-color:rgba(208,138,156,.6);}
.chess-cell.death::after{content:'☠';font-size:16px;color:#d08a9c;position:absolute;opacity:.8;}
.chess-cell.goal{background:rgba(120,180,120,.25);border-color:rgba(157,208,160,.7);}
.chess-cell.goal::after{content:'♔';font-size:18px;color:#9dd0a0;position:absolute;}
.chess-cell.player{background:rgba(201,169,97,.35);border-color:var(--gold);
  box-shadow:inset 0 0 16px rgba(201,169,97,.6);z-index:2;}
.chess-cell.player::after{content:'♙';font-size:22px;color:var(--gold-b);
  text-shadow:0 0 10px rgba(201,169,97,.9);position:absolute;}
.chess-cell.valid{background:rgba(201,169,97,.15);border-color:var(--gold);cursor:pointer;}
.chess-cell.valid::after{content:'◦';color:var(--gold);font-size:20px;position:absolute;opacity:.85;}
.chess-cell.death:hover{background:rgba(160,60,80,.5);}

/* 拼图 */
.puzzle-stage{position:relative;width:280px;height:280px;margin:0 auto;
  border:2px solid var(--line-s);background:rgba(0,0,0,.4);overflow:hidden;touch-action:none;}
[data-theme="day"] .puzzle-stage{background:rgba(255,255,255,.3);}
.puzzle-tile{position:absolute;width:33.3333%;height:33.3333%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--gold);cursor:pointer;
  transition:transform .28s cubic-bezier(.16,1,.3,1);
  border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));}
.puzzle-tile.empty{background:transparent;border:none;cursor:default;}
.puzzle-tile .sym{opacity:.9;text-shadow:0 0 12px rgba(201,169,97,.5);}

/* 骰子 */
.dice-area{text-align:center;padding:16px 0;}
.dice{width:100px;height:100px;margin:0 auto 18px;border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-deco);
  font-size:42px;color:var(--gold-b);background:radial-gradient(circle,rgba(201,169,97,.15),transparent);
  box-shadow:0 0 30px rgba(201,169,97,.3);transform-style:preserve-3d;}

/* 战斗 */
.battle-bar{margin-bottom:12px;}
.battle-name{font-size:12px;color:var(--text);letter-spacing:.1em;margin-bottom:5px;display:flex;justify-content:space-between;}
.battle-track{height:8px;background:rgba(0,0,0,.4);border:1px solid var(--line);position:relative;}
.battle-fill{height:100%;transition:width .4s;background:linear-gradient(90deg,#8b2f4f,#d08a9c);}
.battle-fill.san{background:linear-gradient(90deg,#4a2b5e,#a78bd0);}
.battle-fill.hp{background:linear-gradient(90deg,#7a2f2f,#c07a92);}
.battle-actions{display:flex;gap:10px;margin-top:14px;}
.battle-actions .btn{flex:1;padding:14px 8px;letter-spacing:.2em;}

/* 角色互动 */
.dialog-choices{display:flex;flex-direction:column;gap:8px;margin-top:16px;}

/* 通用输入 */
.inp{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line-s);color:var(--gold-b);
  font-family:var(--f-cn);font-size:15px;padding:11px 14px;letter-spacing:.08em;
  outline:none;transition:all .25s;}
[data-theme="day"] .inp{background:rgba(255,255,255,.6);}
.inp:focus{border-color:var(--gold);box-shadow:0 0 16px rgba(201,169,97,.22);}
.inp::placeholder{color:var(--text-d);letter-spacing:.1em;font-size:13px;}

.ending-card{text-align:center;padding:14px 6px;}
.ending-card .e-icon{font-size:34px;color:var(--gold);margin-bottom:16px;display:block;
  text-shadow:0 0 28px rgba(201,169,97,.7);animation:pulse 2.4s infinite;}
@keyframes pulse{0%,100%{opacity:.6;}50%{opacity:1;}}
.ending-card .e-title{font-family:var(--f-deco);font-size:22px;color:var(--gold-b);
  letter-spacing:.28em;margin-bottom:8px;}
.ending-card .e-sub{font-family:var(--f-en);font-style:italic;font-size:12px;
  color:var(--gold-d);letter-spacing:.2em;margin-bottom:20px;}
.ending-card .e-desc{font-size:14px;line-height:2;color:var(--text);text-align:left;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 4px;margin-bottom:16px;}

/* 空状态 */
.empty{text-align:center;padding:40px 20px;color:var(--text-d);font-size:13px;
  font-style:italic;letter-spacing:.08em;line-height:1.9;}

/* 响应式 */
@media (max-width:380px){
  .title-main{font-size:36px;}
  .map-grid{grid-template-columns:1fr;}
  .tb-title{display:none;}
}
@media (min-width:600px){
  .map-grid{grid-template-columns:repeat(3,1fr);}
}
</style>

<script>
'use strict';
/* ============================================================
   常量与工具
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============================================================
   角色数据
   ============================================================ */
const CHARS = {
  narrator:  { name: '', en: '', sym: '✦' },
  me:        { name: '我', en: 'Me', sym: '◇' },
  tavana:    { name: '塔瓦娜·卡伊', en: 'Tavana Kay', sym: '♕', title: '梦目院院长',

/* ============================================================
   存档状态
   ============================================================ */
const STORAGE_KEY = 'nightfalling_save_v1';
const SETTINGS_KEY = 'nightfalling_settings_v1';

const defaultSettings = {
  theme: 'night',
  fontSize: 1,
  animations: true,
  shake: true,
  sfxOn: true,
  sfxVol: 65,
  textSpeed: 25,   // ms per char
  autoPlay: false,
  skipRead: false,
  confirmChoice: true
};

let state = {
  uid: 'UID: ' + Math.floor(10000000 + Math.random() * 89999999),
  player: { name: '记者', nick: '记者', gender: '不限', personality: '冷静' },
  stats: { silver: 0, sanity: 100 },
  affection: {},
  flags: {},
  readLines: {},
  log: [],
  currentScene: null,      // 当前场景 id
  currentLineIdx: 0,
  screen: 'title'
};

let settings = { ...defaultSettings };

/* ============================================================
   存档读写
   ============================================================ */
function saveGame() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      uid: state.uid,
      player: state.player,
      stats: state.stats,
      affection: state.affection,
      flags: state.flags,
      readLines: state.readLines,
      log: state.log.slice(-200),
      currentScene: state.currentScene,
      currentLineIdx: state.currentLineIdx,
      ts: Date.now()
    }));
  } catch (e) { console.warn('save fail', e); }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    state.uid = d.uid || state.uid;
    state.player = Object.assign(state.player, d.player || {});
    state.stats = Object.assign(state.stats, d.stats || {});
    state.affection = d.affection || {};
    state.flags = d.flags || {};
    state.readLines = d.readLines || {};
    state.log = d.log || [];
    state.currentScene = d.currentScene || null;
    state.currentLineIdx = d.currentLineIdx || 0;
    return true;
  } catch (e) { return false; }
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) settings = Object.assign(defaultSettings, JSON.parse(raw));
  } catch (e) {}
  applySettings();
}
function applySettings() {
  document.documentElement.setAttribute('data-theme', settings.theme);
  document.documentElement.style.setProperty('--font-scale', settings.fontSize);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', settings.theme === 'day' ? '#ece4d2' : '#0a0810');
}

/* ============================================================
   Web Audio 合成音效
   ============================================================ */
const Sfx = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { console.warn('AudioContext unavailable'); }
  },
  ensure() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  vol() {
    if (!settings.sfxOn) return 0;
    return clamp(settings.sfxVol / 100, 0, 1);
  },
  tone(freq, dur, type = 'sine', vol = 0.15, sweep = null) {
    this.ensure();
    if (!this.ctx) return;
    const v = this.vol() * vol;
    if (v <= 0) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (sweep) osc.frequency.exponentialRampToValueAtTime(sweep, t + dur);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(v, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },
  noise(dur = 0.12, vol = 0.15) {
    this.ensure();
    if (!this.ctx) return;
    const v = this.vol() * vol;
    if (v <= 0) return;
    const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(v, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 2000;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    src.start(t);
  },
  click() { this.tone(720, 0.06, 'triangle', 0.1); },
  page()  { this.noise(0.1, 0.1); },
  success() {
    this.tone(523, 0.12, 'sine', 0.15);
    setTimeout(() => this.tone(659, 0.12, 'sine', 0.15), 80);
    setTimeout(() => this.tone(784, 0.22, 'sine', 0.15), 160);
  },
  fail() {
    this.tone(220, 0.18, 'sawtooth', 0.12, 110);
    setTimeout(() => this.tone(160, 0.28, 'sawtooth', 0.1, 80), 120);
  },
  dice() {
    for (let i = 0; i < 5; i++) setTimeout(() => this.noise(0.05, 0.06), i * 55);
  },
  hit() { this.tone(90, 0.16, 'square', 0.14, 50); this.noise(0.08, 0.1); },
  unlock() {
    this.tone(880, 0.1, 'sine', 0.12);
    setTimeout(() => this.tone(1047, 0.18, 'sine', 0.12), 70);
  }
};

/* ============================================================
   震动反馈
   ============================================================ */
function vibrate(ms) {
  if (!settings.shake) return;
  if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {}
}

/* ============================================================
   Toast
   ============================================================ */
function toast(msg, type = '', dur = 2400) {
  const layer = $('#toastLayer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  layer.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 380);
  }, dur);
}

/* ============================================================
   弹窗系统（保证永远能关）
   ============================================================ */
let modalStack = [];
function openModal(opt) {
  const layer = $('#modalLayer');
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${esc(opt.title || '')}</div>
      <button class="modal-close" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">${opt.body || ''}</div>
    ${opt.foot !== false ? `<div class="modal-foot">${opt.footHTML || ''}</div>` : ''}
  `;
  layer.appendChild(wrap);
  layer.classList.add('open');
  modalStack.push(wrap);

  const close = () => closeModal(wrap);
  wrap.querySelector('.modal-close').onclick = () => { Sfx.click(); close(); };
  // 点击遮罩层空白处关闭
  layer.onclick = (e) => {
    if (e.target === layer) { Sfx.click(); close(); }
  };

  if (opt.onMount) opt.onMount(wrap);
  return { el: wrap, close };
}
function closeModal(el) {
  const layer = $('#modalLayer');
  const target = el || modalStack[modalStack.length - 1];
  if (!target) { layer.classList.remove('open'); layer.innerHTML = ''; modalStack = []; return; }
  const idx = modalStack.indexOf(target);
  if (idx >= 0) modalStack.splice(idx, 1);
  target.remove();
  if (!modalStack.length) layer.classList.remove('open');
}
function closeAllModals() {
  const layer = $('#modalLayer');
  layer.classList.remove('open');
  layer.innerHTML = '';
  modalStack = [];
}

/* ============================================================
   页面切换
   ============================================================ */
function showScreen(name) {
  const cur = document.querySelector('.screen.active');
  const nxt = document.getElementById('screen-' + name);
  if (!nxt) return;
  if (cur === nxt) { updateNav(name); return; }
  state.screen = name;

  const doSwap = () => {
    if (cur) cur.classList.remove('active');
    nxt.classList.add('active');
    if (settings.animations) {
      gsap.fromTo(nxt, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.32, ease: 'power2.out' });
    } else {
      nxt.style.opacity = 1;
    }
  };
  if (settings.animations && cur) {
    gsap.to(cur, {
      opacity: 0, duration: 0.18, ease: 'power1.in', onComplete: () => {
        cur.style.opacity = ''; doSwap();
      }
    });
  } else {
    doSwap();
  }

  $('#bottomNav').style.display = (name === 'title') ? 'none' : 'flex';
  updateNav(name);
  if (name === 'map') renderMap();
  if (name === 'log') renderLog();
  if (name === 'settings') renderSettings();
}

function updateNav(name) {
  $$('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === name);
  });
}

/* ============================================================
   对话引擎
   ============================================================ */
let typing = { active: false, timer: null, el: null, full: '', done: null };

function stopTyping() {
  if (typing.timer) clearTimeout(typing.timer);
  typing.active = false;
  if (typing.el) typing.el.textContent = typing.full;
}

function typeInto(el, text, onDone) {
  stopTyping();
  typing.el = el;
  typing.full = text;
  el.textContent = '';
  if (settings.textSpeed <= 0) {
    el.textContent = text;
    typing.active = false;
    onDone && onDone();
    return;
  }
  let i = 0;
  typing.active = true;
  const step = () => {
    if (!typing.active) return;
    if (i >= text.length) {
      typing.active = false;
      onDone && onDone();
      return;
    }
    el.textContent += text.charAt(i++);
    typing.timer = setTimeout(step, settings.textSpeed);
  };
  step();
}

function playScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) {
    console.warn('场景不存在', sceneId);
    showScreen('map');
    return;
  }
  state.currentScene = sceneId;
  state.currentLineIdx = 0;
  state.log = state.log || [];

  if (scene.set) applySet(scene.set);

  showScreen('game');
  $('#sceneBg').className = 'scene-bg bg-' + (scene.bg || 'city');
  $('#locLabel').textContent = scene.loc || '未知之地';
  $('#topLoc').textContent = scene.loc || '——';

  $('#dialogInner').innerHTML = '';
  $('#choices').classList.remove('active');
  $('#choicesInner').innerHTML = '';
  $('#contHint').style.display = 'none';

  renderLine(0);
}

function applySet(set) {
  if (!set) return;
  if (set.aff) {
    for (const k in set.aff) {
      state.affection[k] = (state.affection[k] || 0) + set.aff[k];
    }
  }
  for (const k in set) {
    if (k === 'aff') continue;
    state.flags[k] = set[k];
  }
}

function renderLine(idx) {
  const scene = SCENES[state.currentScene];
  if (!scene) return;
  const lines = scene.lines || [];

  if (idx >= lines.length) {
    // 所有台词结束
    if (scene.choices && scene.choices.length) {
      showChoices(scene.choices);
      return;
    }
    if (scene.next) {
      setTimeout(() => playScene(scene.next), 200);
      return;
    }
    if (scene.onEnd) {
      scene.onEnd();
      return;
    }
    showScreen('map');
    return;
  }

  state.currentLineIdx = idx;
  const line = lines[idx];
  const inner = $('#dialogInner');
  const div = document.createElement('div');
  div.className = 'line';

  if (line.t === 'n') {
    div.classList.add('narration');
    div.innerHTML = '<div class="cn"></div>';
    inner.appendChild(div);
    typeInto(div.querySelector('.cn'), line.cn, () => onLineDone());
    pushLog('旁白', line.cn);
  } else if (line.t === 'me') {
    div.classList.add('monologue');
    div.innerHTML = '<div class="cn"></div>';
    inner.appendChild(div);
    typeInto(div.querySelector('.cn'), line.cn, () => onLineDone());
    pushLog('我', line.cn);
  } else if (line.t === 'd') {
    const ch = CHARS[line.who] || { name: line.who, en: '' };
    div.innerHTML = `<div class="speaker">${esc(ch.name)}${ch.en ? ' · ' + esc(ch.en) : ''}</div>
      <div class="en"></div><div class="cn"></div>`;
    inner.appendChild(div);
    const enEl = div.querySelector('.en');
    const cnEl = div.querySelector('.cn');
    enEl.textContent = line.en || '';
    typeInto(cnEl, line.cn, () => onLineDone());
    pushLog(ch.name, line.cn, line.en);
  }

  scrollToBottom();
  $('#contHint').style.display = 'none';
}

let autoPlayTimer = null;
function onLineDone() {
  if (state.screen !== 'game') return;
  const scene = SCENES[state.currentScene];
  if (!scene) return;
  const lines = scene.lines || [];
  const isLast = state.currentLineIdx >= lines.length - 1;

  if (isLast && ((scene.choices && scene.choices.length) || scene.next || scene.onEnd)) {
    // 等玩家点击
    if (!scene.choices) $('#contHint').style.display = 'block';
  } else {
    $('#contHint').style.display = 'block';
  }

  if (settings.autoPlay) {
    clearTimeout(autoPlayTimer);
    autoPlayTimer = setTimeout(() => advanceLine(), 2000);
  }
}

function advanceLine() {
  if (state.screen !== 'game') return;
  if (typing.active) {
    stopTyping();
    onLineDone();
    return;
  }
  const scene = SCENES[state.currentScene];
  if (!scene) return;

  if (scene.choices && scene.choices.length && state.currentLineIdx >= (scene.lines || []).length - 1) {
    // 已经在最后一行，显示选项
    showChoices(scene.choices);
    return;
  }

  const nextIdx = state.currentLineIdx + 1;
  if (nextIdx < (scene.lines || []).length) {
    Sfx.page();
    renderLine(nextIdx);
  } else {
    renderLine(nextIdx);
  }
}

function scrollToBottom() {
  const el = $('#dialogScroll');
  requestAnimationFrame(() => {
    el.scrollTop = el.scrollHeight;
  });
}

function showChoices(choices) {
  const box = $('#choices');
  const inner = $('#choicesInner');
  inner.innerHTML = '<div class="choice-head">抉 择</div>';
  choices.forEach((c, i) => {
    if (c.cond && !c.cond()) return;
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (c.danger ? ' danger' : '');
    const sym = '①②③④⑤⑥⑦⑧⑨⑩'.charAt(i) || '◆';
    btn.innerHTML = `<span class="choice-idx">${sym}</span><span>${esc(c.cn)}</span>`;
    btn.onclick = () => {
      Sfx.click();
      if (settings.confirmChoice) {
        confirmChoice(c);
      } else {
        selectChoice(c);
      }
    };
    inner.appendChild(btn);
  });
  box.classList.add('active');
  box.scrollTop = 0;
  $('#contHint').style.display = 'none';

  if (settings.animations) {
    gsap.fromTo(box, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' });
  }
}

function confirmChoice(c) {
  openModal({
    title: '确 认 抉 择',
    body: `<p style="font-size:14px;line-height:1.9;color:var(--text);">${esc(c.cn)}</p>
           <p style="font-size:11px;color:var(--text-d);margin-top:12px;letter-spacing:.08em;">此选择将推进剧情。</p>`,
    footHTML: `<button class="btn ghost" id="ccCancel">再想想</button>
               <button class="btn primary" id="ccOk">确认</button>`,
    onMount: (wrap) => {
      wrap.querySelector('#ccCancel').onclick = () => { Sfx.click(); closeModal(wrap); };
      wrap.querySelector('#ccOk').onclick = () => {
        Sfx.success();
        closeModal(wrap);
        selectChoice(c);
      };
    }
  });
}

function selectChoice(c) {
  state.log.push({ type: 'choice', text: c.cn });
  $('#choices').classList.remove('active');
  $('#choicesInner').innerHTML = '';

  if (c.set) applySet(c.set);

  if (c.act) { c.act(); return; }
  if (c.next) { playScene(c.next); return; }
  if (c.ending) { showScreen('map'); return; }
  showScreen('map');
}

/* ============================================================
   日志
   ============================================================ */
function pushLog(speaker, cn, en) {
  if (!state.log) state.log = [];
  state.log.push({ speaker, cn, en });
  if (state.log.length > 300) state.log.shift();
}

function renderMap() {
  const main = $('#mapMain');
  $('#mapSilver').textContent = '银镑 ' + state.stats.silver;
  let html = '';
  MAP_DATA.forEach(reg => {
    html += `<div class="map-region">
      <div class="map-region-head">${esc(reg.region)}</div>
      <div class="map-grid">`;
    reg.spots.forEach(s => {
      const locked = s.locked;
      html += `<div class="map-card ${locked ? 'locked' : ''}" data-spot="${s.id}">
        <div class="map-card-ico">${s.ico}</div>
        <div class="map-card-name">${esc(s.name)}</div>
        <div class="map-card-desc">${esc(s.desc)}</div>
        <div class="map-card-tag ${s.tag && s.tag.includes('小游戏') ? 'hot' : ''}">${esc(s.tag || '')}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  main.innerHTML = html;

  main.querySelectorAll('.map-card').forEach(card => {
    card.onclick = () => {
      if (card.classList.contains('locked')) {
        Sfx.fail();
        toast('该地点尚未解锁', 'warn');
        return;
      }
      Sfx.click();
      const id = card.dataset.spot;
      const spot = MAP_DATA.flatMap(r => r.spots).find(s => s.id === id);
      if (spot) handleSpotClick(spot);
    };
  });
}

function handleSpotClick(spot) {
  switch (spot.action) {
    case 'tavern':
      openCharacterSelect('tavern');
      break;
    case 'manor':
      playScene('manor_1');
      break;
    case 'archive':
      openEvidenceGame();
      break;
    case 'church':
      openPuzzleGame();
      break;
    case 'grove':
      openDreamRogue();
      break;
    case 'chess':
      openChessGame();
      break;
    default:
      toast('此处暂无内容', 'warn');
  }
}

function startCharacterDialogue(id, mode) {
  const c = CHARS[id];
  const data = CHAR_DIALOGUES[id];
  if (!c || !data || !data[mode]) {
    toast('该角色暂无此类型对话', 'warn');
    return;
  }
  const lines = data[mode];

  // 用游戏界面播放
  showScreen('game');
  $('#sceneBg').className = 'scene-bg bg-tavern';
  $('#locLabel').textContent = c.name + ' · ' + (mode === 'deep' ? '深谈' : '闲聊');
  $('#topLoc').textContent = c.name;
  $('#dialogInner').innerHTML = '';
  $('#choices').classList.remove('active');
  $('#contHint').style.display = 'none';

  // 临时构造场景
  const tmpId = '__tmp_char_' + id + '_' + mode;
  SCENES[tmpId] = {
    bg: 'tavern',
    loc: c.name + ' · ' + (mode === 'deep' ? '深谈' : '闲聊'),
    lines: lines.map(l => ({
      t: l.who === 'me' ? 'me' : 'd',
      who: l.who,
      en: l.en,
      cn: l.cn
    })),
    onEnd: () => {
      const gain = mode === 'deep' ? 10 : 5;
      state.affection[id] = (state.affection[id] || 0) + gain;
      Sfx.unlock();
      toast('◈ 与 ' + c.name + ' 的亲密 +' + gain, 'ok');
      saveGame();
      setTimeout(() => showScreen('map'), 600);
    }
  };
  playScene(tmpId);
}

/* ============================================================
   小游戏 1：档案室 · 证据链连线
   ============================================================ */
function openEvidenceGame() {
  const cards = [
    { id: 'a', ico: '🪶', name: '染血的\n乌鸦羽毛' },
    { id: 'b', ico: '♜', name: '封印战场\n焦土样本' },
    { id: 'c', ico: '✉', name: '第三日\n战报' },
    { id: 'd', ico: '☽', name: '梦域扩张\n地图' },
    { id: 'e', ico: '♔', name: '缇斯·沃特森\n身份记录' },
    { id: 'f', ico: '☠', name: '未归之人\n名单' }
  ];
  // 正确配对
  const pairs = [['a', 'e'], ['b', 'c'], ['d', 'f']];

  openModal({
    title: '档 案 室 · 证 据 链',
    body: `
      <div class="mini-title">◈ 证 据 链 ◈</div>
      <div class="mini-sub">点击两张相关卡片，建立证据链。连错将损失理智。</div>
      <div class="mini-hud">
        <div class="mini-hud-item">已连线<b id="evDone">0 / 3</b></div>
        <div class="mini-hud-item">理智<b id="evSan">100</b></div>
      </div>
      <div class="mini-stage evidence-area" id="evArea"></div>
      <div style="text-align:center;margin-top:12px;">
        <button class="btn ghost" id="evReset">重 置</button>
      </div>
    `,
    footHTML: `<button class="btn ghost" id="evClose">关 闭</button>`,
    onMount: (wrap) => {
      const area = wrap.querySelector('#evArea');
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'ev-svg');
      area.appendChild(svg);

      let san = 100;
      let found = 0;
      let selected = null;
      let connections = [];
      const positions = {};

      // 随机位置
      const W = area.clientWidth || 300;
      const H = area.clientHeight || 340;
      cards.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'ev-card';
        el.dataset.id = c.id;
        const x = 10 + (i % 2) * (W / 2 - 10) + Math.random() * 20;
        const y = 10 + Math.floor(i / 2) * (H / 3) + Math.random() * 20;
        el.style.left = clamp(x, 4, W - 92) + 'px';
        el.style.top = clamp(y, 4, H - 70) + 'px';
        el.innerHTML = `<div class="ev-ico">${c.ico}</div>${c.name.replace(/\n/g, '<br>')}`;
        area.appendChild(el);
        positions[c.id] = { el, x: 0, y: 0 };

        el.onclick = () => {
          if (el.classList.contains('done')) return;
          if (!selected) {
            selected = c.id;
            el.classList.add('sel');
            Sfx.click();
          } else if (selected === c.id) {
            el.classList.remove('sel');
            selected = null;
            Sfx.click();
          } else {
            const p = pairs.find(pr =>
              (pr[0] === selected && pr[1] === c.id) || (pr[1] === selected && pr[0] === c.id));
            const fromEl = positions[selected].el;
            const toEl = el;
            if (p) {
              // 正确
              Sfx.success();
              fromEl.classList.remove('sel');
              fromEl.classList.add('done');
              toEl.classList.add('done');
              drawLine(fromEl, toEl, '#c9a961');
              found++;
              wrap.querySelector('#evDone').textContent = found + ' / 3';
              selected = null;
              if (found >= 3) {
                setTimeout(() => winEvidence(wrap), 500);
              }
            } else {
              // 错误
              Sfx.fail();
              san -= 15;
              if (settings.shake) vibrate(120);
              wrap.querySelector('#evSan').textContent = san;
              drawLine(fromEl, toEl, '#c04060', true);
              fromEl.classList.remove('sel');
              selected = null;
              if (san <= 0) {
                setTimeout(() => failEvidence(wrap), 500);
              }
            }
          }
        };
      });

      function drawLine(fromEl, toEl, color, temp) {
        const fr = fromEl.getBoundingClientRect();
        const tr = toEl.getBoundingClientRect();
        const ar = area.getBoundingClientRect();
        const x1 = fr.left - ar.left + fr.width / 2;
        const y1 = fr.top - ar.top + fr.height / 2;
        const x2 = tr.left - ar.left + tr.width / 2;
        const y2 = tr.top - ar.top + tr.height / 2;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1);
        line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', '2');
        line.setAttribute('stroke-dasharray', '5,3');
        line.setAttribute('opacity', temp ? '0.6' : '0.9');
        svg.appendChild(line);
        if (temp) {
          setTimeout(() => line.remove(), 600);
        }
      }

      function winEvidence(wrap) {
        Sfx.success();
        state.stats.silver += 15;
        state.flags.archiveDone = 1;
        saveGame();
        closeModal(wrap);
        openModal({
          title: '证 据 链 · 完 成',
          body: `<div class="ending-card">
            <span class="e-icon">✦</span>
            <div class="e-title">证据链成立</div>
            <div class="e-sub">Evidence Chain Complete</div>
            <div class="e-desc">三组线索相互印证：<br>
              「染血的乌鸦羽毛」与「缇斯·沃特森的身份记录」相符。<br>
              「封印战场焦土」与「第三日战报」相符。<br>
              「梦域扩张地图」与「未归之人名单」相符。<br><br>
              你获得了 15 银镑。
            </div>
          </div>`,
          footHTML: `<button class="btn primary" id="evOk">确认</button>`,
          onMount: (w) => {
            w.querySelector('#evOk').onclick = () => { closeModal(w); showScreen('map'); };
          }
        });
      }

      function failEvidence(wrap) {
        Sfx.fail();
        closeModal(wrap);
        openModal({
          title: '理 智 崩 溃',
          body: `<div class="ending-card">
            <span class="e-icon" style="color:#c04060;">☠</span>
            <div class="e-title" style="color:#c04060;">线索断裂</div>
            <div class="e-sub">Sanity Depleted</div>
            <div class="e-desc">太多错误的连接让你的思路一片混乱。<br>你决定先离开档案室，呼吸一下新鲜空气。</div>
          </div>`,
          footHTML: `<button class="btn primary" id="evBack">返回</button>`,
          onMount: (w) => {
            w.querySelector('#evBack').onclick = () => { closeModal(w); showScreen('map'); };
          }
        });
      }

/* ============================================================
   小游戏 2：日不落酒馆 · QTE 倒酒
   ============================================================ */
function openPourGame() {
  openModal({
    title: '日 不 落 酒 馆 · 调 酒',
    body: `
      <div class="mini-title">◈ 调 酒 ◈</div>
      <div class="mini-sub">按住按钮注入酒液。在标记线处松开手。</div>
      <div class="mini-hud">
        <div class="mini-hud-item">轮次<b id="pourRound">1 / 2</b></div>
        <div class="mini-hud-item">误差<b id="pourErr">--</b></div>
      </div>
      <div class="pour-stage">
        <div class="glass" id="pourGlass">
          <div class="glass-marker m1" id="m1" style="bottom:40%;"><span class="mlabel">40ml</span></div>
          <div class="glass-marker m2" id="m2" style="bottom:60%;"><span class="mlabel">60ml</span></div>
          <div class="glass-liquid" id="pourLiquid"></div>
        </div>
      </div>
      <button class="pour-btn" id="pourBtn">按 住 倒 酒</button>
      <div class="pour-feedback" id="pourFeedback"></div>
    `,
    footHTML: `<button class="btn ghost" id="pourClose">关 闭</button>`,
    onMount: (wrap) => {
      const liquid = wrap.querySelector('#pourLiquid');
      const btn = wrap.querySelector('#pourBtn');
      const fb = wrap.querySelector('#pourFeedback');
      const roundEl = wrap.querySelector('#pourRound');
      const errEl = wrap.querySelector('#pourErr');

      let level = 0;       // 0-100
      let round = 1;       // 1: 40ml, 2: 60ml
      let pouring = false;
      let timer = null;
      let done1 = false;

      const target1 = 40, target2 = 60;

      function setLevel(v) {
        level = clamp(v, 0, 100);
        liquid.style.height = level + '%';
      }

      function startPour() {
        if (pouring) return;
        if (round === 2 && !done1) return;
        pouring = true;
        btn.classList.add('pouring');
        Sfx.tone(180, 0.05, 'sine', 0.03);
        timer = setInterval(() => {
          setLevel(level + 0.8);
          if (level >= 100) stopPour();
        }, 30);
      }

      function stopPour() {
        if (!pouring) return;
        pouring = false;
        btn.classList.remove('pouring');
        clearInterval(timer);
        timer = null;

        if (round === 1) {
          const err = Math.abs(level - target1);
          errEl.textContent = err.toFixed(1) + 'ml';
          if (err <= 4) {
            Sfx.success();
            fb.style.color = '#9dd0a0';
            fb.textContent = '◈ 完美！威士忌 40ml 达成。';
            done1 = true;
            round = 2;
            roundEl.textContent = '2 / 2';
            setTimeout(() => {
              fb.textContent = '继续：柠檬汁 60ml。';
            }, 1200);
          } else {
            Sfx.fail();
            fb.style.color = '#d08a9c';
            fb.textContent = '✕ 误差过大（' + err.toFixed(1) + 'ml）。酒液倒掉了，重新开始。';
            setTimeout(() => {
              setLevel(0);
              errEl.textContent = '--';
              fb.textContent = '';
            }, 1400);
          }
        } else {
          const err = Math.abs(level - target2);
          errEl.textContent = err.toFixed(1) + 'ml';
          if (err <= 5) {
            Sfx.success();
            setTimeout(() => winPour(wrap), 400);
          } else {
            Sfx.fail();
            fb.style.color = '#d08a9c';
            fb.textContent = '✕ 误差过大（' + err.toFixed(1) + 'ml）。重新开始。';
            setTimeout(() => {
              setLevel(0);
              round = 1;
              done1 = false;
              roundEl.textContent = '1 / 2';
              errEl.textContent = '--';
              fb.textContent = '';
            }, 1400);
          }
        }
      }

      btn.addEventListener('mousedown', startPour);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); startPour(); }, { passive: false });
      ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(ev => {
        btn.addEventListener(ev, (e) => { if (ev.startsWith('touch')) e.preventDefault(); stopPour(); }, { passive: false });
      });

      wrap.querySelector('#pourClose').onclick = () => {
        if (timer) clearInterval(timer);
        Sfx.click(); closeModal(wrap);
      };
    }
  });
}

function winPour(wrap) {
  state.stats.silver += 20;
  state.affection.fiman = (state.affection.fiman || 0) + 8;
  state.flags.pourDone = 1;
  saveGame();

/* ============================================================
   小游戏 3：伊林堡 · 棋局走位
   ============================================================ */
function openChessGame() {
  // 棋盘数据：true = 死亡格
  const death = {
    '1-0': true,
    '2-1': true,
    '3-2': true,
    '1-2': true,
    '2-0': false
  };
  const GOAL = { r: 3, c: 3 };

  openModal({
    title: '伊 林 堡 · 棋 局 厅',
    body: `
      <div class="mini-title">◈ 残 局 走 位 ◈</div>
      <div class="mini-sub">你是一枚「兵」。只能向前或斜前方移动。在 5 步内抵达升变格。</div>
      <div class="mini-hud">
        <div class="mini-hud-item">步数<b id="chMoves">0 / 5</b></div>
        <div class="mini-hud-item">理智<b id="chSan">100</b></div>
        <div class="mini-hud-item">状态<b id="chState">前进</b></div>
      </div>
      <div class="chess-board" id="chessBoard"></div>
      <div style="text-align:center;margin-top:14px;font-size:11px;color:var(--text-d);letter-spacing:.1em;">
        ◆ 死亡格 ◆ 升变格 ♙ 你的位置
      </div>
    `,
    footHTML: `<button class="btn ghost" id="chClose">关 闭</button>`,
    onMount: (wrap) => {
      const board = wrap.querySelector('#chessBoard');
      const movesEl = wrap.querySelector('#chMoves');
      const sanEl = wrap.querySelector('#chSan');
      const stateEl = wrap.querySelector('#chState');

      let pos = { r: 0, c: 0 };
      let moves = 0;
      let san = 100;
      let playing = true;
      const MAX_MOVES = 5;

      function render() {
        board.innerHTML = '';
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            const cell = document.createElement('div');
            cell.className = 'chess-cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
            cell.dataset.r = r;
            cell.dataset.c = c;

            if (death[r + '-' + c]) cell.classList.add('death');
            if (r === GOAL.r && c === GOAL.c) cell.classList.add('goal');
            if (r === pos.r && c === pos.c) cell.classList.add('player');

            // 合法移动检查
            if (playing && !death[r + '-' + c]) {
              const dr = r - pos.r;
              const dc = Math.abs(c - pos.c);
              if (dr === 1 && dc <= 1) {
                cell.classList.add('valid');
                cell.onclick = () => moveTo(r, c);
              } else if (death[r + '-' + c]) {
                cell.onclick = () => hitDeath(r, c);
              }
            } else if (playing && death[r + '-' + c]) {
              const dr = r - pos.r;
              const dc = Math.abs(c - pos.c);
              if (dr === 1 && dc <= 1) {
                cell.onclick = () => hitDeath(r, c);
              }
            }

            board.appendChild(cell);
          }
        }
      }

      function moveTo(r, c) {
        if (!playing) return;
        Sfx.click();
        moves++;
        pos = { r, c };
        movesEl.textContent = moves + ' / ' + MAX_MOVES;
        render();

        if (r === GOAL.r && c === GOAL.c) {
          playing = false;
          setTimeout(winChess, 300);
          return;
        }
        if (moves >= MAX_MOVES) {
          playing = false;
          setTimeout(failChess, 400);
        }
      }

      function hitDeath(r, c) {
        if (!playing) return;
        Sfx.fail();
        if (settings.shake) vibrate(150);
        san -= 25;
        sanEl.textContent = Math.max(0, san);
        stateEl.textContent = '受伤';
        stateEl.style.color = '#d08a9c';
        setTimeout(() => { stateEl.textContent = '前进'; stateEl.style.color = ''; }, 700);
        if (san <= 0) {
          playing = false;
          setTimeout(failChess, 400);
        }
      }

      function winChess() {
        Sfx.success();
        state.stats.silver += 25;
        state.flags.chessDone = 1;
        saveGame();
        closeModal(wrap);
        openModal({
          title: '棋 局 · 完 成',
          body: `<div class="ending-card">
            <span class="e-icon">♔</span>
            <div class="e-title">升 变</div>
            <div class="e-sub">Promotion</div>
            <div class="e-desc">你的兵走完了最后一步，落在了棋盘的尽头。<br>
              黑暗中的某个声音说：<br>
              "A pawn that reaches the end... becomes something else."<br>
              「走到尽头的兵……会变成别的东西。」<br><br>
              你获得了 25 银镑。</div>
          </div>`,
          footHTML: `<button class="btn primary" id="chOk">确认</button>`,
          onMount: (w) => {
            w.querySelector('#chOk').onclick = () => { closeModal(w); showScreen('map'); };
          }
        });
      }

      function failChess() {
        Sfx.fail();
        closeModal(wrap);
        openModal({
          title: '棋 局 · 失 败',
          body: `<div class="ending-card">
            <span class="e-icon" style="color:#c04060;">☠</span>
            <div class="e-title" style="color:#c04060;">兵 被 吃 掉 了</div>
            <div class="e-sub">Pawn Captured</div>
            <div class="e-desc">你在棋盘上迷失了方向。<br>下次，先看清楚哪些格子是活着的。</div>
          </div>`,
          footHTML: `<button class="btn primary" id="chBack">返回</button>`,
          onMount: (w) => {
            w.querySelector('#chBack').onclick = () => { closeModal(w); showScreen('map'); };
          }
        });
      }

      render();
      wrap.querySelector('#chClose').onclick = () => { Sfx.click(); closeModal(wrap); };
    }
  });
}

/* ============================================================
   小游戏 4：卡特琳教堂 · 滑块拼图
   ============================================================ */
function openPuzzleGame() {
  const SYMS = ['✦', '☽', '♔', '❖', '✧', '✶', '☩', '♕'];
  // 3x3 滑块拼图：0 代表空格
  let tiles = [1, 2, 3, 4, 5, 6, 7, 8, 0];
  // 打乱（保证可解，用随机合法移动）
  for (let i = 0; i < 60; i++) {
    const emptyIdx = tiles.indexOf(0);
    const neighbors = getNeighbors(emptyIdx);
    const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
    tiles[emptyIdx] = tiles[pick];
    tiles[pick] = 0;
  }

  function getNeighbors(i) {
    const r = Math.floor(i / 3), c = i % 3;
    const out = [];
    if (r > 0) out.push(i - 3);
    if (r < 2) out.push(i + 3);
    if (c > 0) out.push(i - 1);
    if (c < 2) out.push(i + 1);
    return out;
  }

  openModal({
    title: '卡 特 琳 教 堂 · 光 影 拼 图',
    body: `
      <div class="mini-title">◈ 光 影 拼 图 ◈</div>
      <div class="mini-sub">滑动方块，拼出完整的神明图案。</div>
      <div class="mini-hud">
        <div class="mini-hud-item">步数<b id="pzMoves">0</b></div>
        <div class="mini-hud-item">状态<b id="pzState">拼合中</b></div>
      </div>
      <div class="puzzle-stage" id="puzzleStage"></div>
    `,
    footHTML: `<button class="btn ghost" id="pzClose">关 闭</button>
               <button class="btn" id="pzReset">重 置</button>`,
    onMount: (wrap) => {
      const stage = wrap.querySelector('#puzzleStage');
      const movesEl = wrap.querySelector('#pzMoves');
      const stateEl = wrap.querySelector('#pzState');
      let moves = 0;

      function render(animate) {
        stage.innerHTML = '';
        tiles.forEach((v, i) => {
          const el = document.createElement('div');
          el.className = 'puzzle-tile' + (v === 0 ? ' empty' : '');
          if (v === 0) { stage.appendChild(el); return; }
          const row = Math.floor(i / 3), col = i % 3;
          el.style.left = (col * 33.3333) + '%';
          el.style.top = (row * 33.3333) + '%';
          el.innerHTML = `<span class="sym">${SYMS[v - 1]}</span>`;
          el.dataset.idx = i;
          el.onclick = () => tryMove(i);
          if (animate) {
            el.style.transition = 'all .28s cubic-bezier(.16,1,.3,1)';
          }
          stage.appendChild(el);
        });
      }

      function tryMove(idx) {
        const emptyIdx = tiles.indexOf(0);
        const r1 = Math.floor(idx / 3), c1 = idx % 3;
        const r2 = Math.floor(emptyIdx / 3), c2 = emptyIdx % 3;
        if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return;
        Sfx.click();
        tiles[emptyIdx] = tiles[idx];
        tiles[idx] = 0;
        moves++;
        movesEl.textContent = moves;
        render(true);
        setTimeout(checkWin, 300);
      }

      function checkWin() {
        const correct = tiles.every((v, i) => {
          if (i === 8) return v === 0;
          return v === i + 1;
        });
        if (correct) {
          Sfx.success();
          state.stats.silver += 30;
          state.flags.puzzleDone = 1;
          saveGame();
          setTimeout(() => winPuzzle(wrap), 300);
        }
      }

      function winPuzzle(wrap) {
        closeModal(wrap);
        openModal({
          title: '拼 图 · 完 成',
          body: `<div class="ending-card">
            <span class="e-icon">✦</span>
            <div class="e-title">光 影 复 原</div>
            <div class="e-sub">Stained Glass Restored</div>
            <div class="e-desc">彩绘玻璃重新拼合。阳光穿过，在地上投下完整的神明图案。<br>
              祭坛上的雕像依然闭着眼睛。<br><br>
              你获得了 30 银镑。</div>
          </div>`,
          footHTML: `<button class="btn primary" id="pzOk">确认</button>`,
          onMount: (w) => {
            w.querySelector('#pzOk').onclick = () => { closeModal(w); showScreen('map'); };
          }
        });
      }

      render(false);
      wrap.querySelector('#pzClose').onclick = () => { Sfx.click(); closeModal(wrap); };
      wrap.querySelector('#pzReset').onclick = () => {
        Sfx.click();
        tiles = [1, 2, 3, 4, 5, 6, 7, 8, 0];
        for (let i = 0; i < 60; i++) {
          const emptyIdx = tiles.indexOf(0);
          const neighbors = getNeighbors(emptyIdx);
          const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
          tiles[emptyIdx] = tiles[pick];
          tiles[pick] = 0;
        }
        moves = 0; movesEl.textContent = 0;
        render(false);
      };
    }
  });
}

  };

      <div class="battle-bar">
        <div class="battle-name"><span>你</span><span>HP <b id="bPhp">100</b> · SAN <b id="bPsan">100</b></span></div>
        <div class="battle-track"><div class="battle-fill hp" id="bPhpBar" style="width:100%"></div></div>

        <div class="battle-name"><span>焦土残影</span><span>HP <b id="bEhp">100</b></span></div>
        <div class="battle-track"><div class="battle-fill" id="bEhpBar" style="width:100%"></div></div>
      </div>

      <div class="dice-area">
