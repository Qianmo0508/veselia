<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>入魇 · 渲染测试</title>
<style>
  body {
    margin: 0; padding: 0;
    background: #0a0810;
    /* 极简底纹，不使用复杂的 fixed 和 radial-gradient */
    background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
    font-family: "Songti SC", "STSong", serif;
    color: #ded5c4;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    position: relative;
    width: 85%; max-width: 400px;
    padding: 40px 20px;
    background: #16121f;
    border: 1px solid rgba(201,169,97,0.5);
    text-align: center;
    /* 绝对强制显示 */
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
  }
  .title {
    font-size: 48px;
    color: #e8d5a0;
    margin: 0 0 10px 0;
    letter-spacing: 8px;
  }
  .btn {
    margin-top: 20px;
    padding: 12px 24px;
    background: transparent;
    border: 1px solid #c9a961;
    color: #c9a961;
    font-size: 16px;
    width: 100%;
  }
</style>
</head>
<body>

  <div class="card">
    <h1 class="title">入魇</h1>
    <p style="color: #8a8070; font-size: 14px; letter-spacing: 2px;">渲染测试 · 能看见这行字就代表没问题</p>
    <button class="btn" onclick="alert('按钮点击成功！JS 运行正常！')">点击测试</button>
  </div>

</body>
</html>
